  },
  mount(el, params){
    const plan = PLAN[params.id]; if(!plan) return {};
    const mine = S.plan && S.plan.id === plan.id;
    const posts = kolPosts(plan.id);
    let ratio = mine ? {...S.plan.ratio} : {...plan.ratio};
    let source = mine ? S.plan.source : 'system', kolId = mine ? S.plan.kolId : null;
    let selDay = weekIdx(today());
    const sc = $('#pdScroll', el), nav = $('.topnav', el);
    sc.addEventListener('scroll', () => nav.classList.toggle('solid', sc.scrollTop > 60), {passive:true});
    const dayKeyFor = i => addDays(today(), i - weekIdx(today()));
    function upd(bumpK){
      const t = targetFor(S.profile, plan, ratio, plan.cycle ? dayKeyFor(selDay) : today());
      roll($('#kcal', el), t.kcal, 0, 650);
      ['c','p','f'].forEach(k => { const pv = $('#pv-' + k, el); pv.textContent = t.r[k] + '%'; roll($('#g-' + k, el), Math.round(t[k]), 0, 500); if(bumpK === k || bumpK === 'all'){ pv.classList.remove('bump'); void pv.offsetWidth; pv.classList.add('bump'); } });
      $$('[data-act="adj"]', el).forEach(b => { b.disabled = !adjustRatio(ratio, b.dataset.k, +b.dataset.d); });
      const C = 2*Math.PI*50, gap = 3;
      let acc = 0;
      [['dC','c'],['dP','p'],['dF','f']].forEach(([id,k]) => { const seg = C*t.r[k]/100; const c = $('#' + id, el); c.style.strokeDasharray = `${Math.max(0, seg - gap)} ${C}`; c.style.strokeDashoffset = String(-acc); acc += seg; });
      $('#gkg', el).innerHTML = `<div><small>蛋白质 / 每公斤体重</small><b>${fmt(t.p/S.profile.weightKg,1)}<span>g</span></b></div><div><small>脂肪 / 每公斤体重</small><b>${fmt(t.f/S.profile.weightKg,1)}<span>g</span></b></div><div><small>${t.fixed ? '断食日热量' : (t.kcal >= tdee(S.profile) ? '热量盈余' : '热量缺口')}</small><b>${t.fixed ? t.kcal : ((t.kcal - tdee(S.profile)) >= 0 ? '+' : '−') + fmt(Math.abs(Math.round(t.kcal - tdee(S.profile))))}<span>kcal</span></b></div>`;
      $('#warns', el).innerHTML = warnings(S.profile, t).map(w => `<p>${w}</p>`).join('');
      const src = $('#src', el);
      const kp = kolId && posts.find(p => p.id === kolId);
      src.textContent = source === 'kol' && kp ? `已采用 ${kp.author} 的比例` : source === 'custom' ? '自定义比例' : '根据身体数据计算';
      src.classList.toggle('kol', source !== 'system');
      $('#resetBtn', el).style.visibility = source === 'system' ? 'hidden' : 'visible';
      if(plan.cycle){
        const dd = $('#dayDetail', el), day = t.day;
        dd.innerHTML = `周${WD[selDay]}是<b>${day.label}</b> · ${t.fixed ? '固定 ' + t.kcal + ' kcal' : (day.adj === 0 ? '维持热量' : (day.adj > 0 ? '热量 +' : '热量 ') + Math.round(day.adj*100) + '%')}`;
      }
      $$('.adopt', el).forEach(b => { const on = source === 'kol' && b.dataset.k === kolId; b.classList.toggle('on', on); b.innerHTML = on ? `${ic('check')}已采用` : '采用此比例'; });
    }
    $('#kcal', el).dataset.v = '0';
    upd();
    // deck
    const deck = $('#deck', el), cards = $$('.kc', deck);
    let expanded = false, order = cards.map((_, i) => i);
    function layout(){
      const hs = cards.map(c => $('.kc-in', c).offsetHeight);
      if(!expanded){
        const H = hs[order[0]];
        order.forEach((ci, depth) => { const c = cards[ci]; c.style.transitionDelay = '0ms'; c.style.height = H + 'px'; c.style.transform = `translateY(${Math.min(depth,3)*12}px) scale(${1 - Math.min(depth,3)*0.05})`; c.style.zIndex = String(10 - depth); c.style.opacity = depth > 3 ? '0' : '1'; c.classList.toggle('back', depth > 0); });
        deck.style.height = (H + Math.min(order.length - 1, 3)*12) + 'px';
      } else {
        let y = 0;
        order.forEach((ci, depth) => { const c = cards[ci]; c.style.transitionDelay = (depth*45) + 'ms'; c.style.height = hs[ci] + 'px'; c.style.transform = `translateY(${y}px) scale(1)`; c.style.zIndex = String(10 - depth); c.style.opacity = '1'; c.classList.remove('back'); y += hs[ci] + 12; });
        deck.style.height = (y - 12) + 'px';
      }
    }
    layout();
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if(el.isConnected) layout(); });
    const toggleDeck = () => {
      expanded = !expanded; if(expanded) order = cards.map((_, i) => i);
      layout();
      const b = $('#deckBtn', el); b.classList.toggle('up', expanded); $('span', b).textContent = expanded ? '收起' : `查看全部 ${posts.length} 篇`;
      $('#deckHint', el).style.visibility = expanded ? 'hidden' : 'visible';
      vibrate(8);
    };
    // swipe the top card
    let sx = 0, sy = 0, dx = 0, dragging = false, decided = false, topC = null;
    deck.addEventListener('pointerdown', e => {
      if(expanded || e.target.closest('button')) return;
      topC = cards[order[0]]; sx = e.clientX; sy = e.clientY; dx = 0; dragging = true; decided = false;
    });
    deck.addEventListener('pointermove', e => {
      if(!dragging) return;
      const mx = e.clientX - sx, my = e.clientY - sy;
      if(!decided){ if(Math.abs(mx) > 6 && Math.abs(mx) > Math.abs(my)){ decided = true; try{ deck.setPointerCapture(e.pointerId); }catch(_){} topC.classList.add('dragging'); } else if(Math.abs(my) > 8){ dragging = false; return; } else return; }
      dx = mx; topC.style.transform = `translateX(${dx}px) rotate(${dx/18}deg)`;
    });
    const endDrag = () => {
      if(!dragging) return; dragging = false;
      if(!decided){ toggleDeck(); return; }
      topC.classList.remove('dragging');
      if(Math.abs(dx) > 70){
        const dir = Math.sign(dx), c = topC;
        c.style.transform = `translateX(${dir*420}px) rotate(${dir*24}deg)`; c.style.opacity = '0';
        vibrate(10);
        setTimeout(() => { order.push(order.shift()); c.style.transition = 'none'; c.style.transform = `translateY(36px) scale(.85)`; void c.offsetWidth; c.style.transition = ''; layout(); }, 260);
      } else layout();
    };
    deck.addEventListener('pointerup', endDrag);
    deck.addEventListener('pointercancel', () => { if(!dragging) return; dragging = false; if(topC) topC.classList.remove('dragging'); layout(); });
    window.addEventListener('resize', () => { if(el.isConnected) layout(); });
    if(params.scrollTo === 'kol') setTimeout(() => { sc.scrollTo({top:$('#kolH', el).offsetTop - 90, behavior:'smooth'}); }, 560);
    if(params.scrollTo === 'apply') setTimeout(() => { const b = $('.bottom-bar .cbtn', el); if(b){ b.classList.add('wiggle'); setTimeout(() => b.classList.remove('wiggle'), 600); } }, 700);
    const doApply = (btn) => runComplete(btn).then(() => {
      S.plan = {id:plan.id, ratio:{...ratio}, source, kolId, start:mine ? S.plan.start : today()};
      if(!mine){ S.swaps[today()] = {}; }
      save();
      const t = currentTarget();
      openSheet(`<div style="display:flex; flex-direction:column; align-items:center; text-align:center; padding:4px 0 0">
        <div id="hm">${mascot(110, 'happy')}</div><h3 style="margin-top:6px">计划已应用</h3>
        <p class="sub" style="margin-bottom:0">${esc(plan.name)} · 今日目标 <b class="num" style="color:var(--ink)">${fmt(t.kcal)}</b> kcal${t.day ? `（${t.day.label}）` : ''}</p></div>
        <div class="sheet-actions"><button class="btn ghost tap" data-a="later">稍后</button><button class="btn leaf tap" data-a="go">查看今日餐单</button></div>`, (b, close) => {
        cheer($('#hm svg', b), 1600);
        $('[data-a="later"]', b).addEventListener('click', () => { close(); setTimeout(() => go('home', {}, 'tab'), 200); });
        $('[data-a="go"]', b).addEventListener('click', () => { close(); setTimeout(() => setStack([{name:'home'}, {name:'meals'}], 'push'), 200); });
      });
    });
    return {
      acc(t){ t.closest('.acc').classList.toggle('open'); },
      adj(t){ const r = adjustRatio(ratio, t.dataset.k, +t.dataset.d); if(!r) return; ratio = r; source = 'custom'; kolId = null; upd(t.dataset.k); vibrate(5); },
      reset(){ ratio = {...plan.ratio}; source = 'system'; kolId = null; upd('all'); toast('已恢复默认比例'); },
      day(t){ selDay = +t.dataset.i; $$('.wk', el).forEach(w => w.classList.toggle('sel', w === t)); upd('all'); },
      deck(){ toggleDeck(); },
      adopt(t){
        const post = posts.find(p => p.id === t.dataset.k); if(!post) return;
        if(source === 'kol' && kolId === post.id){ ratio = {...plan.ratio}; source = 'system'; kolId = null; upd('all'); toast('已恢复默认比例'); return; }
        ratio = {...post.ratio}; source = 'kol'; kolId = post.id; upd('all');
        const s = $('#sys', el); s.classList.remove('flash'); void s.offsetWidth; s.classList.add('flash');
        toast(`已采用 ${esc(post.author)} 的比例`, {label:'查看', fn:() => sc.scrollTo({top:s.offsetTop - 80, behavior:'smooth'})});
      },
      apply(t){
        if(S.plan && S.plan.id !== plan.id){
          const curName = PLAN[S.plan.id].name;
          confirmSheet({title:'更换计划', text:`当前计划「${esc(curName)}」将替换为「${esc(plan.name)}」，已有记录不受影响。`, ok:'确认更换', cancel:'取消', onOk:() => doApply(t)});
        } else doApply(t);
      }
    };
  }
};

const VISION_ENDPOINT = (window.EM_CONFIG && typeof window.EM_CONFIG.visionEndpoint === 'string') ? window.EM_CONFIG.visionEndpoint.trim() : '';

function foodLibraryText(){ return FOODS.filter(f => !f.tags.includes('supp')).map(f => `${f.id}:${f.name}`).join('，'); }
/* 上传前压缩：长边不超过 1600px、JPEG 质量 0.85；浏览器解不开的格式（如部分 HEIC）直接传原图 */
function shrinkImage(file, maxSide=1600){
  return new Promise(res => {
    if(!file || !/^image\//.test(file.type) || file.type === 'image/gif'){ res(file); return; }
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try{
        const k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        if(k === 1 && file.size < 1.5e6){ URL.revokeObjectURL(url); res(file); return; }
        const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => { URL.revokeObjectURL(url); res(b || file); }, 'image/jpeg', 0.85);
      }catch(e){ URL.revokeObjectURL(url); res(file); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}

function readDataURL(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(file); }); }
function pickPhoto(cb){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/jpeg,image/png,image/webp,image/gif,image/heic,image/*';
  inp.style.display = 'none'; document.body.appendChild(inp);

const num = (v, lo, hi, dflt) => { const n = Number(v); return Number.isFinite(n) ? clamp(n, lo, hi) : dflt; };
function normalizeVision(raw){
  const out = {summary:String((raw && raw.summary) || '').slice(0, 60), note:String((raw && raw.note) || '').slice(0, 120), items:[]};
  const arr = raw && Array.isArray(raw.items) ? raw.items.slice(0, 10) : [];
  arr.forEach((x, i) => {
    if(!x || typeof x !== 'object') return;
    const mid = typeof x.matchId === 'string' && FOOD[x.matchId] && !FOOD[x.matchId].custom ? x.matchId : null;
    let food;
    if(mid) food = FOOD[mid];
    else {
      const name = String(x.name || '').trim().slice(0, 20); if(!name) return;
      const per = x.per100 || {};
      const role = ['protein','carb','veg','fruit','fat','oil','other'].includes(x.role) ? x.role : 'other';
      const id = 'cf_' + hash(name).toString(36);
      food = FOOD[id] || {id, name, cat:'拍照识别', unit:x.unit === 'ml' ? 'ml' : 'g', role, tags:['custom'], aliases:[], custom:true,
        per:{kcal:num(per.kcal, 0, 900, 100), p:num(per.protein, 0, 100, 0), c:num(per.carb, 0, 100, 0), f:num(per.fat, 0, 100, 0), fib:0}};
      FOOD[id] = food;
    }
    const grams = clamp(r5(num(x.grams, 5, 1000, 100)), 5, 1000);
    out.items.push({foodId:food.id, amount:grams, conf:num(x.confidence, 0, 1, .7), on:true, isNew:!!food.custom});
  });
  return out;
}
async function recognize(kind, file, signal){
  const mode = await visionMode();
  if(mode === 'endpoint'){
    const img = await shrinkImage(file);
    const fd = new FormData();
    fd.append('kind', kind);
    fd.append('library', foodLibraryText());
    fd.append('image', img, (img === file && file.name) ? file.name : 'photo.jpg');
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), VISION_TIMEOUT_MS);
    const onAbort = () => ctl.abort(); if(signal) signal.addEventListener('abort', onAbort);
    let r;
    try{ r = await fetch(VISION_ENDPOINT, {method:'POST', body:fd, signal:ctl.signal}); }
    catch(e){ throw {code: signal && signal.aborted ? 'cancelled' : 'upstream_error'}; }
    finally{ clearTimeout(timer); if(signal) signal.removeEventListener('abort', onAbort); }
    if(!r.ok){ const code = r.status === 429 ? 'rate_limited' : (r.status === 413 || r.status === 415) ? 'image_rejected' : r.status === 422 ? 'refused' : 'upstream_error'; throw {code}; }
    let raw; try{ raw = await r.json(); }catch(e){ throw {code:'invalid_json'}; }
    return {mode, data:normalizeVision(raw && raw.data && raw.data.items ? raw.data : raw)};
  }
  if(mode === 'claude'){
    const sm = await getSample();
    const raw = await sm.json(visionPrompt(kind), {images:[file], signal});
    return {mode, data:normalizeVision(raw)};
  }
  return demoRecognize(kind, file, signal);
}
function demoRecognize(kind, file, signal){
  return new Promise((res, rej) => {
    const list = DEMO_RESULTS[kind];
    const pick = list[hash((file && (file.name + file.size)) || String(Date.now())) % list.length];
    const t = setTimeout(() => res({mode:'demo', data:normalizeVision(pick)}), RM ? 300 : 2000);
    if(signal) signal.addEventListener('abort', () => { clearTimeout(t); rej({code:'cancelled'}); });
  });
}
function visionErrorCopy(code){
  if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed','images_unavailable'].includes(code)) return '暂时无法识别，可查看示例或手动添加';
  if(code === 'rate_limited') return '识别次数过多，请稍后再试';
  if(code === 'refused') return '无法识别这张照片，请换一张';
  if(code === 'image_rejected') return '不支持该图片格式，请使用 JPG 或 PNG';
  if(code === 'session_expired') return '登录已过期，请重新登录后再试';
  return '未能识别，请在光线充足处重新拍摄';
}
function defaultMealType(){ const h = new Date().getHours(); return h < 10 ? 'breakfast' : h < 15 ? 'lunch' : h < 17 ? 'snack' : 'dinner'; }
function recipesFor(ids){
  const set = new Set(ids);
  return RECIPES.map(x => { const hit = x.ing.filter(i => set.has(i.f)).length; return {x, hit, score:hit/x.ing.length + (set.has(x.main) ? .6 : 0)}; })
    .filter(r => set.has(r.x.main) && (r.hit >= 2 || r.x.ing.length === 1 || r.hit/r.x.ing.length >= .5)).sort((a,b) => b.score - a.score).slice(0, 3);
}

function weekDates(){ const t = today(), wi = weekIdx(t); return Array.from({length:7}, (_, i) => addDays(t, i - wi)); }
function mealRecipe(date, m){
  const ids = new Set(m.items.filter(x => !x.extra).map(x => x.foodId));
  const c = RECIPES.filter(r => ids.has(r.main)).map((r, i) => ({r, sc:r.ing.filter(g => ids.has(g.f)).length / r.ing.length + (hash(date + m.type + r.id) % 100)/1000}));
  if(!c.length) return null;
  c.sort((a, b) => b.sc - a.sc);
  return c[0].r;
}
function qtyLabel(f, amt){
  const big = amt >= 1000;
  const s1 = big ? `${fmt(amt/1000, 1)} ${f.unit === 'ml' ? 'L' : 'kg'}` : `${Math.round(amt)} ${f.unit}`;
  return s1;
}
function shopList(dates){
  const agg = {};
  dates.forEach(d => genDay(d).meals.forEach(m => m.items.forEach(it => { if(it.extra) return; agg[it.foodId] = (agg[it.foodId] || 0) + it.amount; })));
  const groups = {};
  Object.keys(agg).forEach(id => { let f = FOOD[id], amt = agg[id]; const raw = RAW_OF[id]; if(raw){ f = {...f, id:f.id, name:raw[0], piece:null}; amt = amt*raw[1]; } (groups[f.cat] = groups[f.cat] || []).push({f, amt:Math.round(amt/5)*5}); });
  return FOOD_CATS.filter(c => groups[c]).map(c => ({cat:c, items:groups[c].sort((a,b) => b.amt - a.amt)}));
}

      $('#bkS', el).textContent = S.basket.length ? `蛋白 ${Math.round(n.p)}g · 碳水 ${Math.round(n.c)}g · 脂肪 ${Math.round(n.f)}g` : '未添加食物';
    }
    draw(); bar(false);
    let qt = 0; q.addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(draw, 120); });
    this.refresh = () => bar(true);
    return {
      cat(t){ segSelect(seg, t); cat = t.dataset.c; draw(); },
      clear(){ q.value = ''; draw(); q.focus(); },
      add(t){
        const f = FOOD[t.dataset.id]; addToBasket(f.id, 100);
        const col = {protein:'#4A90E2', carb:'#F5A623', veg:'#2BB673', fruit:'#E0679A', fat:'#E86A5C', oil:'#E86A5C', other:'#93A097'}[f.role];
        flyTo(t, $('.bk-ic', el), col); vibrate(6);
        setTimeout(() => bar(true), RM ? 0 : 560);
      },
      openBasket(){ basketSheet(() => bar(true)); },
      camIng(){ photoFlow('ingredient', () => bar(true)); }
    };
  }
};
function basketSheet(onChange){
  const dk = today();
  const t = S.plan ? currentTarget() : null;
  const html = () => {
    if(!S.basket.length) return `<h3>我的餐单</h3><div class="empty">${mascot(80)}<span>还没有添加食物</span></div>`;
    const n = basketTotal();
    return `<h3>我的餐单</h3>
      <div id="bis">${S.basket.map((b, i) => { const f = FOOD[b.foodId], m = nut(f.id, b.amount); return `<div class="bi" data-i="${i}">${favChip(f)}<span class="fi-txt"><b>${esc(f.name)}</b><small>${Math.round(m.kcal)} kcal · 碳${Math.round(m.c)} 蛋${Math.round(m.p)} 脂${Math.round(m.f)}</small></span><button class="amt-btn tap" data-a="amt" data-i="${i}">${b.amount}${f.unit}</button><button class="del tap" data-a="del" data-i="${i}" aria-label="删除">${ic('trash')}</button></div>`; }).join('')}</div>
      <div class="tot"><div class="tot-h"><span><b class="num">${fmt(Math.round(n.kcal))}</b> <small>kcal</small></span><small>${t ? `占今日目标 ${Math.round(n.kcal/t.kcal*100)}%` : '选好计划后可对比目标'}</small></div>
        ${t ? [['c','碳水','var(--carb)'],['p','蛋白质','var(--pro)'],['f','脂肪','var(--fat)']].map(([k,nm,c]) => `<div class="mac-row" style="margin-top:8px"><div class="mr-t"><span>${nm}</span><span><b>${Math.round(n[k])}</b> / ${Math.round(t[k])}g</span></div><div class="bar"><i style="width:${clamp(n[k]/t[k]*100,0,100)}%;background:${c}"></i></div></div>`).join('') : ''}</div>
      ${S.plan ? `<p class="eyebrow" style="margin:16px 0 8px">添加到</p><div class="seg" id="mSeg"><span class="seg-pill"></span>${['breakfast','lunch','dinner','snack'].map((m, i) => `<button class="seg-btn ${i === 1 ? 'on' : ''}" data-a="meal" data-m="${m}">${MEAL_META[m].n}</button>`).join('')}</div>` : ''}
      <div class="collapse" id="nameBox"><div><div class="name-in"><input id="cmName" placeholder="名称，如：练后餐" maxlength="16"><button class="btn primary sm tap" data-a="saveName">保存</button></div></div></div>
      <div class="sheet-actions sticky"><button class="btn ghost tap" data-a="save">保存为常用餐</button>${S.plan ? cbtn('添加到今日', '', 'leafy').replace('type="submit"', 'data-a="log"') : ''}</div>`;
  };
  openSheet(`<div id="bkBody">${html()}</div>`, (body, close) => {
    const root = $('#bkBody', body);
    let meal = 'lunch';
    const redraw = () => { root.innerHTML = html(); const s = $('#mSeg', root); if(s){ $$('.seg-btn', s).forEach(b => b.classList.toggle('on', b.dataset.m === meal)); requestAnimationFrame(() => movePill(s)); } onChange && onChange(); };
    redraw();
    root.addEventListener('click', e => {
      const b = e.target.closest('[data-a]'); if(!b) return;
      const a = b.dataset.a;
      if(a === 'del'){ const i = +b.dataset.i; const row = b.closest('.bi'); row.classList.add('gone'); setTimeout(() => { S.basket.splice(i, 1); save(); redraw(); }, 260); }
      if(a === 'amt'){ const i = +b.dataset.i; amountSheet(S.basket[i], v => { S.basket[i].amount = v; save(); redraw(); }); }
      if(a === 'meal'){ meal = b.dataset.m; segSelect($('#mSeg', root), b); }
      if(a === 'save'){ $('#nameBox', root).classList.add('open'); setTimeout(() => { const i = $('#cmName', root); if(i) i.focus(); }, 300); }
      if(a === 'saveName'){
        const nm = ($('#cmName', root).value || '').trim();
        if(!nm){ const i = $('#cmName', root); i.style.borderColor = 'var(--danger)'; i.classList.remove('wiggle'); void i.offsetWidth; i.classList.add('wiggle'); return; }
        S.customMeals.push({id:S.nextId++, name:nm, items:S.basket.map(x => ({...x}))}); save(); burstAt(b, 14);
        $('#nameBox', root).classList.remove('open'); toast('已保存到常用餐');
      }
      if(a === 'log'){
        runComplete(b, 500).then(() => {
          S.extra[dk] = S.extra[dk] || []; S.checks[dk] = S.checks[dk] || {};
          S.basket.forEach(x => { const id = S.nextId++; S.extra[dk].push({id, meal, foodId:x.foodId, amount:x.amount}); S.checks[dk]['x|' + id] = true; });
          S.basket = []; save(); onChange && onChange(); close();
          setTimeout(() => toast(`已添加到${MEAL_META[meal].n}`, {label:'查看', fn:() => setStack([{name:'home'}, {name:'meals'}], 'push')}), 300);
        });
      }
    });
  });
}
function amountSheet(item, onDone){
  const f = FOOD[item.foodId];
  const vals = range(5, 1000, 5);
  openSheet(`<h3>选择分量</h3><p class="sub">${esc(f.name)}</p>
    <div class="picker"><div class="pk-band" style="top:50%"></div><div id="amtW"></div></div>
    <p class="amount-live" id="amtLive"></p>
    <div class="sheet-actions"><button class="btn primary tap" data-a="ok">好了</button></div>`, (b, close) => {
    const live = v => { const n = nut(f.id, v); $('#amtLive', b).innerHTML = `<b>${v}${f.unit}</b> · ${Math.round(n.kcal)} kcal · 蛋白 <b>${fmt(n.p,1)}</b>g · 碳水 <b>${fmt(n.c,1)}</b>g · 脂肪 <b>${fmt(n.f,1)}</b>g`; };
    const w = new Wheel($('#amtW', b), {values:vals, index:clamp(Math.round(item.amount/5) - 1, 0, vals.length - 1), label:'数量', format:v => v + f.unit, onChange:live});
    live(w.value);
    $('[data-a="ok"]', b).addEventListener('click', () => { onDone(w.value); close(); });
  });
}

/* =========================================================
   SCREEN: log
   ========================================================= */
SCREENS.log = {
  tab:true,
  render(params){
    this.date = this.date && daysBetween(this.date, today()) >= 0 ? this.date : today();
    return `<div class="scroll" id="logScroll">
      <h1 class="h-xl rise">记录</h1>
      <div class="date-sw rise" style="--i:1"><button class="tap" data-act="prevDay" aria-label="前一天">${ic('back')}</button><div class="dl" id="dl"></div><button class="tap" data-act="nextDay" id="nextDay" aria-label="后一天">${ic('chevR')}</button></div>
      <div id="dayBody"></div>
      <section class="card rise" style="--i:3; margin-top:12px" id="wtCard"></section>
      <section class="card rise" style="--i:4; margin-top:12px" id="waterCard"></section>
      ${disclaimer()}
    </div>`;
  },
  mount(el, params){
    const scr = this;
    function dayBody(dir){
      const dk = scr.date, isToday = dk === today();
      $('#dl', el).innerHTML = `<b>${dateLabel(dk)}</b><small>${isToday ? '今天' : daysBetween(dk, today()) === 1 ? '昨天' : daysBetween(dk, today()) + ' 天前'}</small>`;
      $('#nextDay', el).disabled = isToday;
      const body = $('#dayBody', el);
      if(!S.plan){ body.innerHTML = `<section class="card" style="margin-top:12px"><div class="empty" style="padding:16px 6px">${mascot(70)}<span>选择饮食计划后开始记录</span><button class="btn primary sm tap" data-act="tab" data-to="plans">去选计划</button></div></section>`; return; }
      const {eaten, meals, t} = eatenFor(dk);
      body.innerHTML = `<section class="card ${dir ? (dir < 0 ? 'slide-l' : 'slide-r') : 'rise'}" style="--i:2; margin-top:12px">
        <div style="display:flex; align-items:center; gap:16px">
          <div class="ring-box">${ringSvg(96, [{r:40, w:10, color:'var(--leaf)', track:'var(--line2)', id:'lgRing'}])}<div class="ring-center"><b class="num" style="font-size:18px">${Math.round(eaten.kcal/t.kcal*100)}%</b><small>完成</small></div></div>
          <div style="flex:1"><span class="eyebrow">已吃 / 目标</span><div style="margin:2px 0 8px"><b class="num" style="font-size:26px; font-weight:800">${fmt(Math.round(eaten.kcal))}</b> <small style="color:var(--ink3)">/ ${fmt(t.kcal)} kcal</small></div>
            <div class="kc-leg" style="margin:0; flex-wrap:wrap"><span><i class="dot c"></i>${Math.round(eaten.c)}/${Math.round(t.c)}g</span><span><i class="dot p"></i>${Math.round(eaten.p)}/${Math.round(t.p)}g</span><span><i class="dot f"></i>${Math.round(eaten.f)}/${Math.round(t.f)}g</span></div></div>
        </div>
        <div style="margin-top:10px">${meals.map(m => { const got = m.items.filter(it => isChecked(dk, it.key)); const k = got.reduce((s, it) => s + nut(it.foodId, it.amount).kcal, 0); const meta = MEAL_META[m.type];
          return `<div class="lm"><span class="mic ${meta.cls}">${ic(meta.icon)}</span><div><b>${meta.n}</b><p>${got.length ? got.map(it => FOOD[it.foodId].name).join('、') : '<span style="color:var(--ink3)">未记录</span>'}</p></div><span class="lk">${got.length ? Math.round(k) : '—'}</span></div>`; }).join('')}</div>
        ${isToday ? `<button class="btn soft block sm tap" data-act="toMeals" style="margin-top:8px">查看今日餐单</button>` : ''}
      </section>`;
      requestAnimationFrame(() => requestAnimationFrame(() => setRing($('#lgRing', el), eaten.kcal/t.kcal)));
    }
    function weightCard(){
      const days = Array.from({length:7}, (_, i) => addDays(today(), i - 6));
      const vals = days.map(d => S.weights[d]);
      const have = vals.filter(v => v != null);
      const mn = Math.min(...have, S.profile.weightKg) - 0.5, mx = Math.max(...have, S.profile.weightKg) + 0.3;
      const first = have[0], cur = S.profile.weightKg, delta = first != null ? Math.round((cur - first)*10)/10 : 0;
      $('#wtCard', el).innerHTML = `<div class="wt-head"><div><span class="eyebrow">当前体重</span><div><b class="num">${fmt(cur,1)}</b><small> kg</small>${delta ? `<span class="delta ${delta < 0 ? 'down' : 'up'}">${delta > 0 ? '+' : ''}${fmt(delta,1)}</span>` : ''}</div><small>近 7 天${S.demoWeights ? ' · 前几天为示例数据' : ''}</small></div><button class="btn primary sm tap" data-act="weigh">${ic('scale')}记体重</button></div>
        <div class="bars">${days.map((d, i) => { const v = vals[i]; const h = v != null ? 28 + (v - mn)/(mx - mn)*72 : 22; return `<button class="bcol ${d === today() ? 'today' : ''} ${v == null ? 'none' : ''}" data-act="bar" style="--i:${i}"><span class="bv">${v != null ? fmt(v,1) : '—'}</span><i style="height:${h}%"></i><small>${d === today() ? '今天' : '周' + WD[weekIdx(d)]}</small></button>`; }).join('')}</div>`;
    }
    function waterCard(pop){
      const ml = S.water[today()] || 0, n = Math.round(ml/250);
      $('#waterCard', el).innerHTML = `<div class="water-row"><div><span class="eyebrow">饮水</span><div><b class="num" id="wml">${fmt(ml)}</b> <small>/ 2,000 ml</small></div></div><button class="btn soft sm tap" data-act="water">${ic('drop')} +250ml</button></div>
        <div class="cups">${Array.from({length:8}, (_, i) => `<button class="cup tap ${i < n ? 'on' : ''}" data-act="cup" data-i="${i}" aria-label="第 ${i+1} 杯"><i style="animation-delay:${-i*0.3}s"></i></button>`).join('')}</div>
        <small style="font-size:12px; color:var(--ink3)">${n >= 8 ? '已达成今日饮水目标' : `目标 8 杯 · 还差 ${8 - n} 杯`}</small>`;
      if(pop != null){ const c = $$('.cup', el)[pop]; if(c){ c.classList.remove('wiggle'); void c.offsetWidth; c.classList.add('wiggle'); } }
    }
    dayBody(0); weightCard(); waterCard();
    if(params.scrollTo === 'weight') setTimeout(() => this._open && this._open(), 450);
    const openWeigh = () => {
      openSheet(`<h3>记录体重</h3><p class="sub">${dateLabel(today())}</p>
        <div class="ruler-val"><b class="num" id="wv">${fmt(S.profile.weightKg,1)}</b><small>kg</small></div><div id="wRuler"></div>
        <div class="sheet-actions">${cbtn('保存', '', 'leafy').replace('type="submit"', 'data-a="ok"')}</div>`, (b, close) => {
        const r = new Ruler($('#wRuler', b), {min:30, max:200, step:0.1, px:10, major:10, value:S.profile.weightKg, label:'体重', onChange:v => { $('#wv', b).textContent = fmt(v,1); }});
        $('[data-a="ok"]', b).addEventListener('click', e => {
          const btn = e.currentTarget, v = r.value;
          runComplete(btn, 400).then(() => {
            const oldK = S.plan ? currentTarget().kcal : null;
            S.profile.weightKg = v; S.profile.bmiManual = null; S.weights[today()] = v; save(); close();
            weightCard(); dayBody(0);
            const nk = S.plan ? currentTarget().kcal : null;
            setTimeout(() => toast(`体重已更新 · ${fmt(v,1)} kg${S.plan && oldK !== nk ? `，今日目标调整为 ${fmt(nk)} kcal` : ''}`), 300);
          });
        });
      });
    };
    this._open = openWeigh;
    return {
      prevDay(){ scr.date = addDays(scr.date, -1); dayBody(-1); },
      nextDay(){ if(scr.date === today()) return; scr.date = addDays(scr.date, 1); dayBody(1); },
      toMeals(){ go('meals'); },
      weigh(){ openWeigh(); },
      bar(t){ $$('.bcol', el).forEach(b => b.classList.toggle('show', b === t && !t.classList.contains('show'))); },
      water(){ const ml = S.water[today()] || 0; if(ml >= 4000) return; S.water[today()] = ml + 250; save(); const n = Math.round((ml + 250)/250) - 1; waterCard(n); if(ml + 250 === 2000){ burstAt($('#waterCard', el), 30); } },
      cup(t){ const i = +t.dataset.i, n = Math.round((S.water[today()] || 0)/250); S.water[today()] = (i < n ? i : i + 1)*250; save(); waterCard(i); if(S.water[today()] === 2000) burstAt($('#waterCard', el), 30); }
    };
  }
};

SCREENS.me = {
  tab:true,
  render(){
    const u = S.account ? S.account.u : '你', plan = S.plan ? PLAN[S.plan.id] : null;
    const days = plan ? daysBetween(S.plan.start, today()) + 1 : 0;
    return `<div class="scroll">
      <div class="me-head rise"><span class="me-av">${esc(u[0])}</span><div><b>${esc(u)}</b><small>${plan ? `执行「${esc(plan.short)}」第 ${days} 天` : '未选择计划'}</small></div></div>
      <div class="card rows rise" style="--i:1">
        <button class="row tap" data-act="edit"><span class="ri">${ic('edit')}</span><span>身体档案</span><small>${S.profile.heightCm}cm · ${fmt(S.profile.weightKg,1)}kg</small>${ic('chevR','chev-r')}</button>
        <button class="row tap" data-act="plan"><span class="ri">${ic('bowl')}</span><span>当前计划</span><small>${plan ? esc(plan.name) : '未选择'}</small>${ic('chevR','chev-r')}</button>
        <button class="row tap" data-act="mine"><span class="ri">${ic('list')}</span><span>常用餐</span><small>${S.customMeals.length} 份</small>${ic('chevR','chev-r')}</button>
        <button class="row tap" data-act="week"><span class="ri">${ic('cal')}</span><span>本周计划</span><small>${plan ? '菜谱 · 采购清单' : '未选择计划'}</small>${ic('chevR','chev-r')}</button>
        <button class="row tap" data-act="builder"><span class="ri">${ic('fork')}</span><span>我的餐单</span><small>${S.basket.length} 样食材</small>${ic('chevR','chev-r')}</button>
      </div>
      <div class="card rows rise" style="--i:2">
        <button class="row tap" data-act="about"><span class="ri">${ic('info')}</span><span>免责声明与数据说明</span>${ic('chevR','chev-r')}</button>
        <button class="row tap danger" data-act="wipe"><span class="ri">${ic('trash')}</span><span>清除本机数据</span>${ic('chevR','chev-r')}</button>

      ${disclaimer()}

  },
  mount(el){
    return {
      edit(){ go('onboard', {edit:true}); },
      plan(){ if(S.plan) go('plan', {id:S.plan.id}); else go('plans', {}, 'tab'); },
      builder(){ go('builder'); },
      mine(){
        openSheet(`<h3>常用餐</h3>${S.customMeals.length ? `${S.customMeals.map(m => { const n = m.items.reduce((s, x) => addN(s, nut(x.foodId, x.amount)), ZERO); return `<div class="bi"><span class="fav r-veg">${esc(m.name[0])}</span><span class="fi-txt"><b>${esc(m.name)}</b><small>${m.items.map(x => FOOD[x.foodId].name).join('、')} · ${Math.round(n.kcal)} kcal</small></span><button class="amt-btn tap" data-a="use" data-id="${m.id}">加入餐单</button></div>`; }).join('')}` : `<div class="empty">${mascot(80)}<span>还没有常用餐</span></div>`}`, (b, close) => {
          b.addEventListener('click', e => { const u = e.target.closest('[data-a="use"]'); if(!u) return; const m = S.customMeals.find(x => String(x.id) === u.dataset.id); if(!m) return; m.items.forEach(x => addToBasket(x.foodId, x.amount, true)); save(); close(); setTimeout(() => go('builder'), 200); });
        });
      },
      about(){ openSheet(`<h3>免责声明与数据说明</h3><p class="sub" style="line-height:1.8">本应用内容仅供参考，不构成医疗或营养诊疗建议；如有疾病、孕期或特殊情况，请咨询医生或注册营养师。<br><br>「达人推荐」里的内容在正式版中来自小红书公开笔记的概括，并注明作者与原帖；本演示版全部为虚构的示例数据。<br><br>食物营养数据参考《中国食物成分表》的常见数值，上线前需要逐条核对。演示版的所有数据只保存在你这台设备的浏览器里。</p><div class="sheet-actions"><button class="btn primary tap" data-a="ok">知道了</button></div>`, (b, close) => $('[data-a="ok"]', b).addEventListener('click', close)); },
      wipe(){ confirmSheet({title:'清除本机数据？', text:'身体档案、计划和所有记录都会被删除，而且没法恢复。', ok:'确定清除', danger:true, onOk:() => { S = freshState(); save(); go('onboard', {}, 'root'); toast('本机数据已清除'); }}); }
    };
  }
};

function registerCustomFoods(){ Object.values(S.customFoods || {}).forEach(f => { if(f && f.id) FOOD[f.id] = f; }); }

  registerCustomFoods();
  go(S.profile ? 'home' : 'onboard', {}, 'root');
}

  onboard(){ ensureAccount(); save(); setStack([{name:'onboard', params:S.profile ? {edit:true} : {}}], 'root'); },

$$('[data-jump]').forEach(b => b.addEventListener('click', () => { const f = JUMPS[b.dataset.jump]; if(f) f(); }));

function clock(){ const d = new Date(); $('#sbTime').textContent = `${d.getHours()}:${pad(d.getMinutes())}`; }
clock(); setInterval(clock, 30000);
getSample();
window.addEventListener('resize', () => { $$('.seg', app).forEach(movePill); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => $$('.seg', app).forEach(movePill));
boot();
})();
