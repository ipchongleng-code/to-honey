<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eating Manager</title>
<meta name="description" content="Eating Manager 健身饮食计划 App 可交互原型：建档、计划库、达人比例对比、三餐勾选、菜谱与记录。">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Eating Manager">
<meta property="og:title" content="Eating Manager">
<meta property="og:description" content="把网上五花八门的饮食计划，变成一份照着吃的三餐。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 110'%3E%3Cpath d='M24 52C24 30 40 17 60 17s36 13 36 35z' fill='%23fff' stroke='%23111915' stroke-width='6'/%3E%3Cpath d='M13 51h94c0 26-20 45-47 45S13 77 13 51z' fill='%232BB673' stroke='%23111915' stroke-width='6'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); box-sizing:border-box; height:100%}
body{margin:0; font:14px/1.5 system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<script src="config.js"></script>
<style>
/* Layout: theme-aware stage with a guide panel + a fixed light-mode phone prototype (full-bleed on phones) */
:root{
  --stage:#EDEFEE; --stage-ink:#121A16; --stage-mute:#5F6964; --stage-card:#FFFFFF; --stage-line:#DCE0DE; --stage-acc:#148A55;
  --paper:#FFFFFF; --card:#FFFFFF; --fill:#F4F6F5; --ink:#111915; --ink2:#59645E; --ink3:#9AA39E; --line:#E7EAE8; --line2:#F1F3F2;
  --leaf:#2BB673; --leaf-d:#148A55; --leaf-l:#E8F7EF;
  --carb:#F5A623; --carb-l:#FEF1D9; --pro:#4A90E2; --pro-l:#E3EEFB; --fat:#E86A5C; --fat-l:#FCE6E3;
  --warn-bg:#FFF6DC; --warn-ink:#8A5A00; --danger:#D9443F; --butter:#FFE9A6;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"Bricolage Grotesque","DIN Alternate","Avenir Next","Noto Sans SC",system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1); --spring-hard:cubic-bezier(.2,1.9,.45,1); --out:cubic-bezier(.22,1,.36,1);
  --top:50px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --stage:#0E1611; --stage-ink:#E3ECE5; --stage-mute:#93A59A; --stage-card:#16211A; --stage-line:#26352B; --stage-acc:#4FD08F; color-scheme:dark } }
:root[data-theme="dark"]{ --stage:#0E1611; --stage-ink:#E3ECE5; --stage-mute:#93A59A; --stage-card:#16211A; --stage-line:#26352B; --stage-acc:#4FD08F; color-scheme:dark }

html,body{height:100%}
[hidden]{display:none !important}
body{background:var(--stage); color:var(--stage-ink); font-family:var(--f-body); -webkit-font-smoothing:antialiased; overflow-x:hidden}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent}
input{font:inherit; color:inherit}
svg.i{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none}
:focus-visible{outline:2.5px solid var(--leaf); outline-offset:2px}
.num{font-family:var(--f-num); font-variant-numeric:tabular-nums; letter-spacing:-.01em}

/* ---------- stage ---------- */
.stage{min-height:100%; display:flex; align-items:center; justify-content:center; gap:56px; padding:24px max(16px, env(safe-area-inset-right,0px)) 24px max(16px, env(safe-area-inset-left,0px)); box-sizing:border-box}
.side{width:320px; flex:none; display:flex; flex-direction:column; gap:18px}
.side .eyebrow{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--stage-mute); font-weight:500}
.side h1{font-family:var(--f-num); font-weight:800; font-size:44px; line-height:.95; margin:0; letter-spacing:-.03em}
.side h1 em{font-style:normal; color:var(--stage-acc)}
.side p{margin:0; color:var(--stage-mute); line-height:1.7; font-size:14px}
.side h2{font-size:13px; margin:6px 0 0; color:var(--stage-mute); font-weight:500; letter-spacing:.08em}
.jumps{display:flex; flex-direction:column; gap:6px}
.jump{display:grid; grid-template-columns:28px 1fr auto; align-items:center; gap:10px; text-align:left; padding:10px 12px; border-radius:14px; background:var(--stage-card); border:1px solid var(--stage-line); transition:transform .5s var(--spring-hard), border-color .2s}
.jump:hover{border-color:var(--stage-acc)}
.jump.is-pressed{transform:scale(.96); transition-duration:.1s}
.jump b{font-size:14px; display:block}
.jump small{color:var(--stage-mute); font-size:12px; display:block; margin-top:2px; line-height:1.5}
.jump .jn{font-family:var(--f-num); font-weight:700; font-size:13px; width:28px; height:28px; border-radius:9px; display:grid; place-items:center; background:var(--stage); color:var(--stage-acc)}
.jump .go{font-size:12px; color:var(--stage-acc)}
.side-foot{display:flex; gap:10px; align-items:center; font-size:12px; color:var(--stage-mute)}
.side-foot button{padding:8px 14px; border-radius:99px; border:1px solid var(--stage-line); font-size:13px; color:var(--stage-ink)}

.phone{position:relative; flex:none; height:min(844px, calc(100vh - 48px)); min-height:640px; aspect-ratio:390/844; background:#0B0E0C; border-radius:56px; padding:11px; box-sizing:border-box; box-shadow:0 0 0 2px #2A302C, 0 40px 80px -30px rgba(10,30,18,.45), 0 18px 30px -18px rgba(10,30,18,.35)}
#app{position:relative; width:100%; height:100%; border-radius:46px; overflow:hidden; overflow:clip; background:var(--paper); color:var(--ink); font-size:15px; isolation:isolate; user-select:none; -webkit-user-select:none}
#app input{user-select:text; -webkit-user-select:text}
.island{position:absolute; top:11px; left:50%; transform:translateX(-50%); width:118px; height:34px; border-radius:20px; background:#0B0E0C; z-index:80; pointer-events:none}
.statusbar{position:absolute; top:0; left:0; right:0; height:50px; display:flex; align-items:center; justify-content:space-between; padding:4px 34px 0 38px; z-index:79; font:600 15px var(--f-num); pointer-events:none; color:var(--ink)}
.statusbar .sb-r{display:flex; gap:6px; align-items:center}
.statusbar .bat{width:25px; height:12px; border:1.5px solid currentColor; border-radius:4px; position:relative; opacity:.9}
.statusbar .bat::after{content:""; position:absolute; inset:1.5px; right:5px; background:currentColor; border-radius:1.5px}
#view{position:absolute; inset:0; overflow:hidden; overflow:clip}
/* confirmation mark: circle + check with spring */
.okmark{position:absolute; left:0; top:0; z-index:96; pointer-events:none; border-radius:50%; background:var(--leaf); display:grid; place-items:center; box-shadow:0 10px 24px -8px rgba(43,182,115,.55); animation:okIn .6s var(--spring-hard) both}
.okmark svg{width:56%; height:56%; fill:none; stroke:#fff; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round}
.okmark path{stroke-dasharray:26; stroke-dashoffset:26; animation:okDraw .38s .16s var(--out) forwards}
.okmark.out{animation:okOut .32s ease-in both}
.okmark.big{box-shadow:0 22px 48px -16px rgba(43,182,115,.6)}
@keyframes okIn{0%{transform:var(--at) scale(0)} 60%{transform:var(--at) scale(1.14)} 100%{transform:var(--at) scale(1)}}
@keyframes okOut{from{transform:var(--at) scale(1); opacity:1} to{transform:var(--at) scale(.7); opacity:0}}
@keyframes okDraw{to{stroke-dashoffset:0}}
#layer{position:absolute; inset:0; pointer-events:none; z-index:90}
#layer > *{pointer-events:auto}

@media (max-width: 980px){ .side{display:none} }
@media (max-width: 640px){
  body{overflow:hidden}
  .stage{padding:0; min-height:0; height:100%; display:block}
  .phone{width:100%; height:100%; min-height:0; aspect-ratio:auto; border-radius:0; padding:0; box-shadow:none; background:var(--paper)}
  #app{border-radius:0}
  .island,.statusbar{display:none}
  :root{--top:14px}
}

/* ---------- screens & transitions ---------- */
.screen{position:absolute; inset:0; background:var(--paper); will-change:transform; overflow:hidden; overflow:clip}
.screen::before{content:""; position:absolute; left:0; right:0; top:0; height:calc(var(--top) + 4px); background:linear-gradient(var(--paper) 72%, rgba(255,255,255,0)); z-index:10; pointer-events:none}
.scroll{position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; padding:calc(var(--top) + 10px) 20px 120px; -webkit-overflow-scrolling:touch; scrollbar-width:none; overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.screen.has-nav .scroll{padding-top:calc(var(--top) + 58px)}
.screen.has-bar .scroll{padding-bottom:130px}
.enter-push{animation:inR .5s var(--out) both; box-shadow:-24px 0 40px rgba(19,36,26,.08); z-index:2}
.leave-push{animation:outL .5s var(--out) both}
.enter-pop{animation:inL .46s var(--out) both}
.leave-pop{animation:outR .46s var(--out) both; z-index:3; box-shadow:-24px 0 40px rgba(19,36,26,.08)}
.enter-tab{animation:tabIn .42s var(--out) both; z-index:2}
.leave-tab{animation:fadeOut .22s ease both}
.enter-root{animation:rootIn .6s var(--spring) both; z-index:2}
.leave-root{animation:fadeOut .3s ease both}
@keyframes inR{from{transform:translateX(100%)}}
@keyframes outL{to{transform:translateX(-26%); filter:brightness(.94)}}
@keyframes inL{from{transform:translateX(-26%); filter:brightness(.94)}}
@keyframes outR{to{transform:translateX(100%)}}
@keyframes tabIn{from{opacity:0; transform:translateY(16px) scale(.985)}}
@keyframes rootIn{from{opacity:0; transform:scale(.93)}}
@keyframes fadeOut{to{opacity:0}}
.rise{animation:rise .62s var(--spring) both; animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0; transform:translateY(18px) scale(.97)}}

/* press = squash, release = spring back */
.tap{transform:translateY(var(--ty,0)) scale(var(--s,1)); transition:transform .6s var(--spring-hard), background-color .25s, color .25s, border-color .25s, box-shadow .25s, opacity .25s}
.tap.is-pressed{--s:.93; transition-duration:.12s, .25s, .25s, .25s, .25s, .25s; transition-timing-function:ease-out}

/* ---------- common pieces ---------- */
.h-xl{font-size:28px; font-weight:900; letter-spacing:-.01em; margin:0; line-height:1.25; text-wrap:balance}
.sub{color:var(--ink2); margin:6px 0 0; line-height:1.6; font-size:14px}
.sec-title{font-size:17px; font-weight:700; margin:26px 0 12px; display:flex; align-items:baseline; justify-content:space-between}
.sec-title small{font-size:12px; color:var(--ink3); font-weight:400}
.btn{height:52px; border-radius:18px; display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:700; font-size:16px; padding:0 20px}
.btn.primary{background:var(--ink); color:#fff; box-shadow:0 10px 20px -10px rgba(19,36,26,.6)}
.btn.leaf{background:var(--leaf); color:#fff; box-shadow:0 10px 20px -10px rgba(43,182,115,.8)}
.btn.ghost{background:var(--card); color:var(--ink); border:1.5px solid var(--line)}
.btn.soft{background:var(--leaf-l); color:var(--leaf-d)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45; pointer-events:none}
.btn.sm{height:40px; border-radius:13px; font-size:14px; padding:0 14px}
.link{color:var(--leaf-d); font-weight:500; font-size:14px; padding:8px 4px}
.chip-sm{display:inline-flex; align-items:center; gap:4px; font-size:12px; padding:3px 9px; border-radius:99px; background:var(--line2); color:var(--ink2)}
.card{background:var(--card); border-radius:24px; padding:18px; border:1px solid var(--line); box-shadow:0 10px 26px -22px rgba(17,25,21,.28)}
.disclaimer{font-size:11.5px; line-height:1.7; color:var(--ink3); margin:28px 4px 0; text-align:center}
.eyebrow{font-size:12px; color:var(--ink3); letter-spacing:.06em}

.mbar{display:flex; height:8px; border-radius:6px; overflow:hidden; gap:2px; background:transparent}
.mbar i{display:block; height:100%; border-radius:3px; transition:flex-grow .7s var(--spring)}
.mbar .c{background:var(--carb)} .mbar .p{background:var(--pro)} .mbar .f{background:var(--fat)}
.dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex:none}
.dot.c{background:var(--carb)} .dot.p{background:var(--pro)} .dot.f{background:var(--fat)}

/* topnav for pushed screens */
.topnav{position:absolute; top:0; left:0; right:0; z-index:20; padding:calc(var(--top) + 4px) 14px 8px; display:flex; align-items:center; gap:10px; transition:background .25s, box-shadow .25s}
.topnav.solid{background:rgba(255,255,255,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow:0 1px 0 var(--line)}
.topnav .nav-t{flex:1; font-weight:700; font-size:16px; opacity:0; transform:translateY(6px); transition:opacity .25s, transform .4s var(--spring); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.topnav.solid .nav-t, .topnav.always .nav-t{opacity:1; transform:none}
.icon-btn{width:42px; height:42px; border-radius:15px; display:grid; place-items:center; background:var(--fill); flex:none}
.nav-r{display:flex; gap:8px}
.pill-btn{display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 12px; border-radius:12px; background:var(--fill); font-size:13px; font-weight:500}
.pill-btn svg.i{width:16px; height:16px}

/* bottom action bar */
.bottom-bar{position:absolute; left:0; right:0; bottom:0; z-index:15; padding:14px 20px calc(22px + env(safe-area-inset-bottom,0px)); background:linear-gradient(rgba(255,255,255,0), var(--paper) 34%)}
@media (min-width:641px){ .bottom-bar{padding-bottom:30px} }

/* completion-feedback button */
.cbtn{position:relative; display:grid; place-items:center; height:56px; width:100%; margin-inline:auto; border-radius:28px; background:var(--ink); color:#fff; font-weight:700; font-size:16px; box-shadow:0 14px 26px -14px rgba(19,36,26,.7); transition:width .5s var(--spring), background-color .3s, transform .6s var(--spring-hard), box-shadow .3s}
.cbtn .cb-label{transition:opacity .2s, transform .3s; white-space:nowrap; display:flex; align-items:center; gap:8px}
.cbtn .cb-spin{position:absolute; width:22px; height:22px; border-radius:50%; border:2.5px solid rgba(255,255,255,.25); border-top-color:#fff; opacity:0}
.cbtn .cb-check{position:absolute; width:28px; height:28px; fill:none; stroke:#fff; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; opacity:0}
.cbtn .cb-check path{stroke-dasharray:26; stroke-dashoffset:26}
.cbtn.loading, .cbtn.done{width:56px; pointer-events:none}
.cbtn.loading .cb-label, .cbtn.done .cb-label{opacity:0; transform:scale(.6)}
.cbtn.loading .cb-spin{opacity:1; animation:spin .7s linear infinite}
.cbtn.done{background:var(--leaf); box-shadow:0 12px 24px -10px rgba(43,182,115,.6); animation:donePop .6s var(--spring-hard)}
.cbtn.done .cb-check{opacity:1}
.cbtn.done .cb-check path{transition:stroke-dashoffset .4s .1s var(--out); stroke-dashoffset:0}
.cbtn.leafy{background:var(--leaf)}
.cbtn.locked{background:#B9C3BC; box-shadow:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes donePop{0%{transform:scale(.82)} 55%{transform:scale(1.16)} 100%{transform:scale(1)}}

/* segmented control with sliding pill */
.seg{position:relative; display:flex; padding:4px; background:var(--fill); border-radius:16px}
.seg-pill{position:absolute; top:4px; bottom:4px; left:0; border-radius:12px; background:var(--card); box-shadow:0 4px 12px -6px rgba(17,25,21,.3), 0 0 0 1px rgba(17,25,21,.04); transition:transform .55s var(--spring), width .55s var(--spring)}
.seg-btn{position:relative; z-index:1; flex:1; height:38px; border-radius:12px; font-size:14px; font-weight:500; color:var(--ink2); transition:color .25s}
.seg-btn.on{color:var(--ink); font-weight:700}
.seg.dark .seg-pill{background:var(--ink)} .seg.dark .seg-btn.on{color:#fff}

.chiprow{position:relative; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin:0 -20px; padding:2px 20px 6px}
.chiprow::-webkit-scrollbar{display:none}
.chiprow .rail{position:relative; display:flex; gap:6px; flex:none}
.chiprow .seg-pill{top:0; bottom:0; background:var(--ink); border-radius:12px}
.chiprow .seg-btn{flex:none; padding:0 14px; height:36px; color:var(--ink2); background:transparent; white-space:nowrap}
.chiprow .seg-btn.on{color:#fff}

/* checkbox */
.ck{width:28px; height:28px; border-radius:50%; border:2px solid #C8D1C9; display:grid; place-items:center; flex:none; background:var(--card); transition:background-color .25s, border-color .25s, transform .6s var(--spring-hard)}
.ck svg{width:18px; height:18px; fill:none; stroke:#fff; stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
.ck svg path{stroke-dasharray:24; stroke-dashoffset:24; transition:stroke-dashoffset .32s .05s var(--out)}
.ck[aria-checked="true"]{background:var(--leaf); border-color:var(--leaf)}
.ck[aria-checked="true"] svg path{stroke-dashoffset:0}
.ck[aria-checked="mixed"]{border-color:var(--leaf)}
.ck[aria-checked="mixed"]::after{content:""; width:11px; height:3px; border-radius:2px; background:var(--leaf); grid-area:1/1}
.ck[aria-checked="mixed"] svg{display:none}
.ck.pop{animation:ckpop .5s var(--spring-hard)}
@keyframes ckpop{0%{transform:scale(.7)} 60%{transform:scale(1.18)} 100%{transform:scale(1)}}
.ck.sq{border-radius:9px}

/* chips toggle */
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{display:inline-flex; align-items:center; gap:0; height:36px; padding:0 14px; border-radius:12px; background:var(--fill); border:1.5px solid var(--fill); font-size:14px; color:var(--ink2)}
.chip .chk{width:0; overflow:hidden; display:inline-flex; transition:width .35s var(--spring), margin .35s var(--spring)}
.chip .chk svg{width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; flex:none}
.chip.on{background:var(--ink); border-color:var(--ink); color:#fff}
.chip.on .chk{width:14px; margin-right:6px}
.chip.warn.on{background:#3A2A12; border-color:#3A2A12}

/* fields */
.field{position:relative; display:block; background:var(--fill); border-radius:18px; border:1.5px solid var(--fill); transition:border-color .25s, box-shadow .25s}
.field input{width:100%; height:58px; border:0; outline:0; background:transparent; padding:20px 50px 0 18px; box-sizing:border-box; font-size:16px}
.field span{position:absolute; left:18px; top:19px; font-size:15px; color:var(--ink3); transition:transform .35s var(--spring), font-size .25s, color .25s; transform-origin:left top; pointer-events:none}
.field input:focus + span, .field input:not(:placeholder-shown) + span{transform:translateY(-11px); font-size:12px; color:var(--ink2)}
.field:focus-within{border-color:var(--ink); background:var(--card); box-shadow:0 0 0 4px rgba(17,25,21,.05)}
.field.bad{border-color:var(--danger); animation:shake .42s}
.field .eye{position:absolute; right:8px; top:8px; width:42px; height:42px; display:grid; place-items:center; color:var(--ink3)}
@keyframes shake{20%{transform:translateX(-7px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(2px)}}
.wiggle{animation:wiggle .5s}
@keyframes wiggle{20%{transform:rotate(-3deg) scale(1.03)} 40%{transform:rotate(3deg)} 60%{transform:rotate(-2deg)} 80%{transform:rotate(1deg)}}

/* collapse via grid rows */
.collapse{display:grid; grid-template-rows:0fr; transition:grid-template-rows .5s var(--out), opacity .3s; opacity:0}
.collapse > div{overflow:hidden; min-height:0}
.collapse.open{grid-template-rows:1fr; opacity:1}

/* accordion */
.acc{background:var(--card); border-radius:20px; overflow:hidden; border:1px solid var(--line)}
.acc-head{width:100%; display:flex; align-items:center; justify-content:space-between; padding:16px 18px; font-weight:700; font-size:15px; text-align:left}
.acc-head small{font-weight:400; color:var(--ink3); font-size:12px; margin-left:6px}
.acc-head .chev{transition:transform .5s var(--spring); color:var(--ink3)}
.acc.open .acc-head .chev{transform:rotate(180deg)}
.acc-body{display:grid; grid-template-rows:0fr; transition:grid-template-rows .55s var(--out)}
.acc.open .acc-body{grid-template-rows:1fr}
.acc-inner{overflow:hidden; min-height:0}
.acc-pad{padding:0 18px 18px}

/* mascot */
.mascot{display:block; overflow:visible}
.mascot .m-body{animation:bob 3.2s ease-in-out infinite; transform-origin:60px 96px}
.mascot .m-eyes{animation:blink 4.4s infinite; transform-origin:60px 70px}
.mascot .m-happy{display:none}
.mascot.happy .m-eyes{display:none} .mascot.happy .m-happy{display:block}
.mascot.hop .m-body{animation:hop .7s var(--spring-hard)}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)} 95%{transform:scaleY(.1)}}
@keyframes hop{0%{transform:translateY(0) scale(1,1)} 25%{transform:translateY(2px) scale(1.12,.86)} 55%{transform:translateY(-18px) scale(.94,1.08)} 80%{transform:translateY(0) scale(1.05,.95)} 100%{transform:none}}

/* sheet */
.sheet-wrap{position:absolute; inset:0; z-index:60}
.sheet-bg{position:absolute; inset:0; background:rgba(12,24,16,.4); opacity:0; transition:opacity .3s}
.sheet{position:absolute; left:0; right:0; bottom:-40px; background:var(--card); border-radius:30px 30px 0 0; padding:0 20px calc(64px + env(safe-area-inset-bottom,0px)); transform:translateY(105%); transition:transform .55s var(--spring); max-height:86%; display:flex; flex-direction:column; box-sizing:border-box}
.sheet-wrap.open .sheet{transform:none}
.sheet-wrap.open .sheet-bg{opacity:1}
.grab-zone{padding:10px 0 12px; cursor:grab; touch-action:none; flex:none}
.grab{width:42px; height:5px; border-radius:3px; background:#D7DED6; margin:0 auto}
.sheet-body{overflow-y:auto; scrollbar-width:none; min-height:0}
.sheet h3{font-size:20px; font-weight:900; margin:0 0 6px}
.sheet .sub{margin-bottom:16px}
.sheet-actions{display:flex; gap:10px; margin-top:18px}
.sheet-actions .btn{flex:1}
.sheet-actions.sticky{position:sticky; bottom:0; background:var(--card); padding:10px 0 4px; margin-top:8px; z-index:2}
.sheet-actions .cbtn{flex:1.3 1 0; width:auto; transition:flex .5s var(--spring), background-color .3s, transform .6s var(--spring-hard)}
.sheet-actions .cbtn.loading, .sheet-actions .cbtn.done{flex:0 0 56px}

/* toast */
.toast{position:absolute; top:calc(var(--top) + 6px); left:50%; z-index:99; transform:translate(-50%,-160%) scale(.9); transition:transform .55s var(--spring); background:var(--ink); color:#fff; border-radius:18px; padding:11px 14px 11px 16px; font-size:14px; display:flex; align-items:center; gap:12px; box-shadow:0 14px 30px -12px rgba(0,0,0,.45); width:max-content; max-width:calc(100% - 40px); box-sizing:border-box; line-height:1.5}
.toast.show{transform:translate(-50%,0) scale(1)}
.toast button{color:#8FE3B6; font-weight:700; font-size:14px; flex:none; padding:4px 2px}

/* tab bar */
.tabbar{position:absolute; left:14px; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); height:66px; border-radius:24px; background:rgba(255,255,255,.94); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); box-shadow:0 18px 34px -16px rgba(19,36,26,.4), 0 0 0 1px rgba(19,36,26,.04); display:flex; z-index:40; transition:transform .5s var(--spring), opacity .3s}
@media (min-width:641px){ .tabbar{bottom:22px} }
.tabbar.hide{transform:translateY(130%); opacity:0; pointer-events:none}
.tab-blob{position:absolute; top:8px; bottom:8px; left:0; width:25%; padding:0 8px; box-sizing:border-box; transition:transform .6s var(--spring)}
.tab-blob::before{content:""; display:block; height:100%; border-radius:17px; background:var(--leaf-l)}
.tab{position:relative; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:11px; color:var(--ink3); z-index:1}
.tab svg.i{width:22px; height:22px}
.tab.on{color:var(--leaf-d); font-weight:700}
.tab.on svg{animation:tabPop .55s var(--spring-hard)}
@keyframes tabPop{40%{transform:translateY(-4px) scale(1.15)}}

/* ---------- login ---------- */
.login-hero{display:flex; flex-direction:column; align-items:flex-start; padding-top:6px}
.login-mascot{margin:0 0 8px -6px}
.wordmark{font-family:var(--f-num); font-weight:800; font-size:46px; line-height:.92; letter-spacing:-.04em; margin:0}
.wordmark em{font-style:normal; color:var(--leaf)}
.lead{color:var(--ink2); line-height:1.7; margin:12px 0 24px; font-size:15px}
.form{display:flex; flex-direction:column; gap:12px; margin-top:16px}
.agree{display:flex; gap:12px; align-items:flex-start; padding:6px 4px 2px; text-align:left; font-size:13.5px; color:var(--ink2); line-height:1.6}
.agree b{color:var(--ink); font-weight:500}
.agree small{display:block; color:var(--ink3); font-size:12px}
.form-err{min-height:20px; margin:0; color:var(--danger); font-size:13px; text-align:center; transition:opacity .2s}
.hint{text-align:center; font-size:12px; color:var(--ink3); margin:14px 0 0}

/* ---------- onboarding ---------- */
.ob-top{position:absolute; top:0; left:0; right:0; z-index:5; padding:calc(var(--top) + 6px) 20px 0; display:flex; align-items:center; gap:12px; background:var(--paper)}
.ob-top::after{content:""; position:absolute; left:0; right:0; top:100%; height:16px; background:linear-gradient(var(--paper), rgba(255,255,255,0)); pointer-events:none}
.ob-prog{flex:1; display:flex; gap:6px}
.ob-prog i{flex:1; height:6px; border-radius:4px; background:var(--line); overflow:hidden; position:relative}
.ob-prog i::after{content:""; position:absolute; inset:0; background:var(--leaf); transform:scaleX(0); transform-origin:left; transition:transform .7s var(--spring)}
.ob-prog i.on::after{transform:scaleX(1)}
.ob-step{font:700 13px var(--f-num); color:var(--ink3); width:40px; text-align:right}
.ob-track{position:absolute; inset:0; display:flex; transition:transform .65s var(--spring)}
.ob-track.s2{transform:translateX(-100%)}
.ob-panel{position:relative; flex:0 0 100%; height:100%; overflow:hidden; overflow:clip}
.ob-panel .scroll{padding-top:calc(var(--top) + 64px); padding-bottom:140px}
.gender{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:22px 0 18px}
.g-tile{position:relative; background:var(--card); border-radius:22px; padding:16px 12px 14px; display:flex; flex-direction:column; align-items:center; gap:6px; border:2px solid var(--line); box-shadow:none}
.g-tile svg.fig{width:56px; height:56px}
.g-tile b{font-size:15px}
.g-tile.on{border-color:var(--ink); --ty:-4px; box-shadow:0 18px 26px -16px rgba(19,36,26,.45)}
.g-tile .tick{position:absolute; top:10px; right:10px; width:22px; height:22px; border-radius:50%; background:var(--ink); color:#fff; display:grid; place-items:center; transform:scale(0); transition:transform .5s var(--spring-hard)}
.g-tile.on .tick{transform:scale(1)}
.g-tile .tick svg{width:13px; height:13px; fill:none; stroke:#fff; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round}

.picker{position:relative; background:var(--fill); border-radius:24px; padding:10px 8px 12px}
.pk-labels, .pk-cols{display:grid; grid-template-columns:1fr 1fr 1.25fr; gap:4px}
.pk-labels span{text-align:center; font-size:12px; color:var(--ink3); padding:4px 0 2px}
.pk-band{position:absolute; left:10px; right:10px; top:calc(50% + 4px); height:42px; transform:translateY(-50%); border-radius:13px; background:var(--card); box-shadow:0 4px 14px -8px rgba(17,25,21,.25); pointer-events:none}
.pk-w{display:grid; grid-template-columns:1.25fr 1fr}
.wheel{position:relative; height:200px; perspective:640px; touch-action:none; cursor:grab; outline:none; -webkit-mask-image:linear-gradient(transparent, #000 32%, #000 68%, transparent); mask-image:linear-gradient(transparent, #000 32%, #000 68%, transparent)}
.wheel.grabbing{cursor:grabbing}
.wheel-in{position:absolute; inset:0; transform-style:preserve-3d}
.wslot{position:absolute; left:0; right:0; top:0; height:40px; line-height:40px; text-align:center; font:500 19px var(--f-num); font-variant-numeric:tabular-nums; color:var(--ink3); backface-visibility:hidden; will-change:transform}
.wslot.sel{color:var(--ink); font-weight:800; font-size:23px}
.wheel.ticked .wslot.sel{animation:tick .28s var(--spring-hard)}
@keyframes tick{50%{scale:1.12}}
.wheel:focus-visible{outline:none} .wheel:focus-visible .wslot.sel{color:var(--leaf-d)}

.bmi-card{margin-top:14px; padding:16px 18px}
.bmi-row{display:flex; align-items:baseline; gap:10px}
.bmi-row .lab{font-size:13px; color:var(--ink2)}
.bmi-row .num{font-size:34px; font-weight:800; line-height:1}
.cat-pill{font-size:12px; padding:3px 10px; border-radius:99px; font-weight:700; transition:background-color .3s, color .3s}
.cat-under{background:var(--pro-l); color:#2D6CB5} .cat-normal{background:var(--leaf-l); color:var(--leaf-d)} .cat-over{background:var(--carb-l); color:#A86A00} .cat-obese{background:var(--fat-l); color:#B4463A}
.gauge{position:relative; margin:14px 0 6px; height:10px}
.gauge-segs{display:flex; height:10px; gap:3px}
.gauge-segs i{border-radius:5px}
.gauge-needle{position:absolute; top:-6px; width:4px; height:22px; border-radius:3px; background:var(--ink); transform:translateX(-50%); transition:left .7s var(--spring); box-shadow:0 0 0 3px #fff}
.gauge-lab{display:flex; justify-content:space-between; font-size:11px; color:var(--ink3)}
.bmi-ask b{display:block; font-size:17px}
.bmi-ask small{display:block; font-size:12.5px; color:var(--ink3); margin-top:3px}
.bmi-src{margin-left:auto; font-size:12px; color:var(--ink3)}
.bmi-tip{font-size:13px; color:var(--ink2); margin:10px 0 0; line-height:1.6}

.goal-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:18px 0 26px}
.goal{position:relative; text-align:left; background:var(--card); border-radius:20px; padding:14px; border:2px solid transparent; display:flex; flex-direction:column; gap:6px; border-color:var(--line)}
.goal .gi{width:38px; height:38px; border-radius:12px; display:grid; place-items:center}
.goal b{font-size:16px}
.goal small{font-size:12px; color:var(--ink2); line-height:1.5}
.goal.on{border-color:var(--ink); --ty:-3px; box-shadow:0 14px 24px -18px rgba(17,25,21,.4)}
.goal .tick{position:absolute; top:12px; right:12px; width:22px; height:22px; border-radius:50%; background:var(--ink); display:grid; place-items:center; transform:scale(0); transition:transform .5s var(--spring-hard)}
.goal.on .tick{transform:scale(1)}
.goal .tick svg{width:13px; height:13px; fill:none; stroke:#fff; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round}

.h-md{font-size:18px; font-weight:900; margin:0 0 4px}
.notch-wrap{background:var(--card); border:1px solid var(--line); border-radius:22px; padding:20px 18px 16px; margin-top:12px}
.notch{position:relative; height:44px; touch-action:none; cursor:pointer; outline:none}
.notch-rail{position:absolute; left:14px; right:14px; top:50%}
.notch-track{position:absolute; left:0; right:0; top:-4px; height:8px; border-radius:5px; background:var(--line)}
.notch-fill{position:absolute; left:0; top:0; bottom:0; border-radius:5px; background:var(--leaf); transition:width .55s var(--spring)}
.notch-dot{position:absolute; top:-6px; width:12px; height:12px; margin-left:-6px; border-radius:50%; background:#fff; border:2px solid var(--line); box-sizing:border-box; transition:border-color .25s, background .25s}
.notch-dot.on{border-color:var(--leaf)}
.notch-thumb{position:absolute; top:-17px; width:34px; height:34px; margin-left:-17px; border-radius:50%; background:var(--card); box-shadow:0 6px 16px -4px rgba(19,36,26,.4), 0 0 0 1px rgba(19,36,26,.06); transition:left .55s var(--spring); display:grid; place-items:center}
.notch-thumb::after{content:""; width:12px; height:12px; border-radius:50%; background:var(--leaf)}
.notch.dragging .notch-thumb, .notch.dragging .notch-fill{transition:none}
.notch.dragging .notch-thumb{transform:scale(1.15)}
.notch-thumb.bump{animation:bump .35s var(--spring-hard)}
@keyframes bump{50%{scale:1.2}}
.notch-labels{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink3); margin:4px 2px 0}
.act-desc{display:flex; align-items:center; gap:10px; margin-top:14px; padding-top:14px; border-top:1px dashed var(--line)}
.act-desc b{font-size:16px}
.act-desc span{font-size:13px; color:var(--ink2); flex:1}
.act-desc .x{font:700 13px var(--f-num); color:var(--leaf-d); background:var(--leaf-l); padding:3px 8px; border-radius:8px; flex:none}
.swap-in{animation:swapIn .45s var(--spring)}
@keyframes swapIn{from{opacity:0; transform:translateY(8px)}}

.pro-sec{margin-top:16px}
.pro-sec h4{font-size:14px; margin:0 0 10px; display:flex; justify-content:space-between; align-items:baseline}
.pro-sec h4 small{font-weight:400; color:var(--ink3); font-size:12px}
.link-note{font-size:12.5px; line-height:1.6; color:var(--ink2); background:var(--line2); border-radius:12px; padding:9px 12px; margin:10px 0 0; transition:background .3s, color .3s}
.link-note.warmup{background:var(--warn-bg); color:var(--warn-ink)}
.link-note b{font-family:var(--f-num); font-size:15px}

.ruler{position:relative; height:74px; overflow:hidden; touch-action:none; cursor:grab; outline:none; -webkit-mask-image:linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); mask-image:linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent)}
.ruler-strip{position:absolute; top:0; bottom:0; left:0; will-change:transform; background:repeating-linear-gradient(90deg, #B9C4BC 0 1.5px, transparent 1.5px var(--px)) 0 100% / calc(100% + 2px) 16px no-repeat, repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px var(--major)) 0 100% / calc(100% + 2px) 30px no-repeat}
.ruler-strip span{position:absolute; top:6px; transform:translateX(-50%); font:500 12px var(--f-num); color:var(--ink3)}
.ruler-needle{position:absolute; left:50%; bottom:0; width:3px; height:44px; margin-left:-1.5px; background:var(--leaf); border-radius:2px}
.ruler-needle::before{content:""; position:absolute; top:-8px; left:50%; margin-left:-6px; border:6px solid transparent; border-top-color:var(--leaf)}
.ruler-val{text-align:center; margin-bottom:4px}
.ruler-val b{font:800 30px var(--f-num)}
.ruler-val small{color:var(--ink3); margin-left:4px}

/* ---------- home ---------- */
.home-top{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; position:relative}
.hello{margin:0; color:var(--ink2); font-size:14px}
.h-name{margin:2px 0 0; font-size:26px; font-weight:900; line-height:1.2}
.mascot-btn{position:relative; margin-bottom:-4px}
.bubble{position:absolute; right:84px; top:4px; background:var(--ink); color:#fff; font-size:13px; padding:8px 12px; border-radius:14px 14px 4px 14px; white-space:nowrap; transform:scale(0); transform-origin:100% 100%; transition:transform .45s var(--spring-hard); pointer-events:none}
.bubble.show{transform:scale(1)}
.body-card{margin-top:16px; padding:18px; background:var(--ink); color:#fff; border-radius:28px; position:relative; overflow:hidden}
.body-card::after{content:""; position:absolute; right:-40px; top:-60px; width:180px; height:180px; border-radius:50%; background:radial-gradient(circle, rgba(43,182,115,.35), transparent 70%)}
.bc-top{display:flex; justify-content:space-between; align-items:center; font-size:13px; color:rgba(255,255,255,.7); position:relative; z-index:1}
.bc-top button{color:#8FE3B6; font-size:13px; display:flex; align-items:center; gap:4px}
.bc-main{margin:14px 0 4px; position:relative; z-index:1}
.bc-main .lab{font-size:13px; color:rgba(255,255,255,.65)}
.bc-main .big{display:flex; align-items:baseline; gap:6px; margin-top:2px}
.bc-main .big .num{font-size:48px; font-weight:800; line-height:1}
.bc-main .big small{color:rgba(255,255,255,.6)}
.bc-main p{margin:6px 0 0; font-size:12.5px; color:rgba(255,255,255,.55)}
.bc-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px; position:relative; z-index:1}
.bc-stat{background:rgba(255,255,255,.07); border-radius:16px; padding:10px 12px}
.bc-stat span{font-size:11.5px; color:rgba(255,255,255,.55); display:block}
.bc-stat b{font:800 19px var(--f-num); display:block; margin-top:2px}
.bc-stat b{white-space:nowrap}
.bc-stat i{font-style:normal; font-family:var(--f-body); font-size:10.5px; font-weight:700; padding:1px 5px; border-radius:6px; margin-left:4px; vertical-align:3px; white-space:nowrap}

.empty-plan{width:100%; border:2px dashed #BFCBBF; border-radius:26px; padding:34px 20px 30px; display:flex; flex-direction:column; align-items:center; gap:12px; background:var(--card); border-color:#CDD5D0}
.empty-plan .plus{width:64px; height:64px; border-radius:22px; background:var(--ink); color:#fff; display:grid; place-items:center; animation:breathe 2.6s ease-in-out infinite; transition:transform .5s var(--spring-hard)}
.empty-plan .plus svg{width:30px; height:30px; stroke-width:2.6}
.empty-plan b{font-size:16px}
.empty-plan small{font-size:12.5px; color:var(--ink2); text-align:center; line-height:1.6}
.empty-plan.is-pressed .plus{transform:rotate(90deg) scale(.9)}
@keyframes breathe{50%{box-shadow:0 0 0 12px rgba(19,36,26,.06)}}

.plan-card{padding:18px}
.pc-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.pc-head h3{margin:3px 0 0; font-size:19px; font-weight:900}
.day-pill{font-size:12px; font-weight:700; padding:5px 10px; border-radius:10px; white-space:nowrap}
.dt-high{background:var(--carb-l); color:#A86A00} .dt-medium{background:var(--butter); color:#7A5A00} .dt-low{background:var(--pro-l); color:#2D6CB5} .dt-fast{background:var(--fat-l); color:#B4463A} .dt-normal{background:var(--leaf-l); color:var(--leaf-d)}
.pc-body{display:flex; align-items:center; gap:16px; margin:16px 0}
.ring-box{position:relative; flex:none}
.ring-box svg{display:block; transform:rotate(-90deg)}
.ring-box circle{fill:none; stroke-linecap:round; transition:stroke-dashoffset 1s var(--spring)}
.ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center}
.ring-center b{font:800 22px var(--f-num); line-height:1}
.ring-center small{font-size:11px; color:var(--ink3); margin-top:3px}
.mac-list{flex:1; display:flex; flex-direction:column; gap:10px; min-width:0}
.mac-row .mr-t{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink2); margin-bottom:5px}
.mac-row .mr-t b{color:var(--ink); font-family:var(--f-num); font-weight:700}
.mac-row .bar{height:7px; border-radius:5px; background:var(--fill); overflow:hidden}
.mac-row .bar i{display:block; height:100%; border-radius:5px; width:0; transition:width 1s var(--spring)}
.pc-actions{display:grid; grid-template-columns:1.4fr 1fr; gap:10px}
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:4px}
.wk{position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; padding:7px 0 6px; border-radius:12px; font-size:11px; color:var(--ink2)}
.wk b{font-size:12px; font-weight:700}
.wk.today::after{content:""; position:absolute; bottom:-6px; width:5px; height:5px; border-radius:50%; background:var(--ink)}
.wk.sel{box-shadow:0 0 0 2px var(--ink); --ty:-3px}
.next-card{display:flex; align-items:center; gap:14px; margin-top:12px; padding:14px 16px; width:100%; text-align:left}
.next-card .nc-ic{width:44px; height:44px; border-radius:15px; background:var(--carb-l); color:#A86A00; display:grid; place-items:center; flex:none}
.next-card div{flex:1; min-width:0}
.next-card b{display:block; font-size:15px}
.next-card small{display:block; font-size:12.5px; color:var(--ink2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* ---------- plans list ---------- */
.q{font-size:14px; color:var(--ink2); margin:16px 0 10px}
.search{display:flex; align-items:center; gap:10px; height:50px; border-radius:17px; background:var(--fill); padding:0 8px 0 16px; margin-top:14px; border:1.5px solid var(--fill); transition:border-color .25s, box-shadow .25s}
.search:focus-within{border-color:var(--ink); background:var(--card); box-shadow:0 0 0 4px rgba(17,25,21,.05)}
.search svg{color:var(--ink3)}
.search input{flex:1; border:0; outline:0; background:transparent; font-size:15px; min-width:0}
.search .clr{width:34px; height:34px; border-radius:11px; display:grid; place-items:center; color:var(--ink3); transform:scale(0); transition:transform .4s var(--spring-hard)}
.search.has .clr{transform:scale(1)}
.hot{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.hot button{font-size:12.5px; color:var(--ink2); padding:5px 11px; border-radius:99px; background:var(--card); border:1px solid var(--line)}
.grp-t{display:flex; align-items:baseline; gap:8px; margin:26px 2px 10px}
.grp-t b{font-size:16px}
.grp-t small{font-family:var(--f-num); font-size:12px; color:var(--ink3)}
.pl-list{display:flex; flex-direction:column; gap:10px}
.pl-card{display:flex; align-items:center; gap:14px; text-align:left; width:100%; background:var(--card); border-radius:22px; padding:16px; border:1px solid var(--line); box-shadow:0 10px 26px -22px rgba(17,25,21,.28)}
.pl-main{flex:1; min-width:0}
.pl-title{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.pl-title b{font-size:16px}
.rec{font-size:12px; color:var(--leaf-d); opacity:.75; font-weight:500}
.pl-for{font-size:12.5px; color:var(--ink2); margin:5px 0 8px; line-height:1.5}
.pl-tags{display:flex; gap:6px; flex-wrap:wrap}
.pl-side{flex:none; display:flex; flex-direction:column; align-items:center; gap:6px; width:54px}
.vstack{width:16px; height:54px; border-radius:6px; overflow:hidden; display:flex; flex-direction:column; gap:2px}
.vstack i{display:block}
.pl-side small{font:600 10.5px var(--f-num); color:var(--ink3); letter-spacing:.02em}
.pl-card.is-risk{background:var(--fill); border-color:var(--fill); box-shadow:none}
.pl-card.is-risk b, .pl-card.is-risk .pl-for{color:var(--ink3)}
.risk-tag{font-size:11.5px; color:#7B857E; background:#E2E6E1; padding:2px 8px; border-radius:7px}
.empty{display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; padding:30px 10px; color:var(--ink2); font-size:14px; line-height:1.6}

/* ---------- plan detail ---------- */
.pd-hero .cat{display:inline-block; font-size:12px; font-weight:700; padding:4px 10px; border-radius:9px; background:var(--leaf-l); color:var(--leaf-d)}
.pd-hero h1{font-size:30px; font-weight:900; margin:10px 0 8px; line-height:1.2; text-wrap:balance}
.pd-hero p{margin:0; color:var(--ink2); line-height:1.75; font-size:14.5px}
.risk{display:flex; gap:10px; background:var(--warn-bg); color:var(--warn-ink); border-radius:16px; padding:12px 14px; margin-top:16px; font-size:13px; line-height:1.6}
.risk svg{flex:none; margin-top:1px}
.fit{display:flex; flex-direction:column; gap:8px; margin-top:16px}
.fit-row{display:flex; gap:12px; align-items:flex-start; background:var(--fill); border-radius:16px; padding:12px 14px}
.fit-row .fi-ic{width:26px; height:26px; border-radius:9px; display:grid; place-items:center; flex:none}
.fit-row.ok .fi-ic{background:var(--leaf-l); color:var(--leaf-d)}
.fit-row.no .fi-ic{background:var(--fat-l); color:#B4463A}
.fit-row .fi-ic svg{width:15px; height:15px; stroke-width:2.6}
.fit-row b{font-size:13px; display:block}
.fit-row p{margin:2px 0 0; font-size:13px; color:var(--ink2); line-height:1.6}
.howto{margin:0; padding:0 0 0 2px; list-style:none; counter-reset:h; display:flex; flex-direction:column; gap:10px}
.howto li{counter-increment:h; display:flex; gap:12px; font-size:14px; line-height:1.65; color:var(--ink2)}
.howto li::before{content:counter(h); flex:none; width:24px; height:24px; border-radius:8px; background:var(--line2); color:var(--ink); font:700 12px var(--f-num); display:grid; place-items:center; margin-top:1px}
.clock-card{display:flex; align-items:center; gap:16px; margin-top:12px}
.clock-card p{margin:0; font-size:13px; color:var(--ink2); line-height:1.7}
.clock-card b{display:block; font-size:15px; color:var(--ink); margin-bottom:4px}

.sys{margin-top:22px; padding:18px; transition:box-shadow .3s}
.sys.flash{animation:flash .9s ease}
@keyframes flash{30%{box-shadow:0 0 0 4px var(--leaf), 0 12px 28px -18px rgba(19,36,26,.22)}}
.sys-h{display:flex; align-items:center; justify-content:space-between; gap:8px}
.badge-sys{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; background:var(--ink); color:#fff; padding:5px 10px; border-radius:9px}
.src{font-size:12px; color:var(--ink3); text-align:right; transition:color .3s}
.src.kol{color:var(--leaf-d); font-weight:500}
.sys-main{display:flex; align-items:center; gap:18px; margin-top:16px}
.donut{position:relative; flex:none; width:128px; height:128px}
.donut svg{transform:rotate(-90deg); display:block}
.donut circle{fill:none; stroke-width:14; transition:stroke-dasharray .8s var(--spring), stroke-dashoffset .8s var(--spring)}
.donut .ring-center b{font-size:24px}
.adj-list{display:flex; flex-direction:column; margin-top:12px}
.adj{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line2)}
.adj .an{flex:1; min-width:0; font-size:14px; display:flex; align-items:center; gap:8px}
.adj .ag{margin-left:auto; font-size:12px; color:var(--ink3); white-space:nowrap}
.adj .ag b{font-family:var(--f-num); color:var(--ink); font-size:15px}
.stepper{display:flex; align-items:center; background:var(--fill); border-radius:12px; padding:3px; flex:none}
.stepper button{width:28px; height:28px; border-radius:9px; display:grid; place-items:center; font:700 17px var(--f-num); color:var(--ink)}
.stepper button:disabled{opacity:.25; pointer-events:none}
.stepper .pv{width:40px; text-align:center; font:800 15px var(--f-num)}
.pv.bump{animation:pvb .4s var(--spring-hard)}
@keyframes pvb{50%{transform:scale(1.3)}}
.gkg{flex:1; min-width:0; display:flex; flex-direction:column; gap:10px}
.gkg div small{display:block; font-size:12px; color:var(--ink3)}
.gkg div b{font:800 18px var(--f-num)}
.gkg div b span{font-size:12px; font-weight:500; color:var(--ink3); margin-left:3px}
.warns{display:flex; flex-direction:column; gap:6px; margin-top:10px}
.warns p{margin:0; font-size:12.5px; line-height:1.55; background:var(--warn-bg); color:var(--warn-ink); border-radius:10px; padding:7px 10px}
.sys-foot{display:flex; justify-content:space-between; align-items:center; margin-top:8px}
.sys-foot small{font-size:11.5px; color:var(--ink3)}
.day-detail{font-size:12.5px; color:var(--ink2); margin:10px 0 0; text-align:center}
.day-detail b{color:var(--ink)}

.kol-h{display:flex; align-items:center; gap:8px; margin:30px 0 4px}
.kol-h h2{margin:0; font-size:19px; font-weight:900}
.mock-tag{font-size:11px; color:var(--ink3); border:1px solid var(--line); padding:2px 7px; border-radius:7px}
.kol-note{font-size:12px; color:var(--ink3); margin:0 0 14px; display:flex; justify-content:space-between; gap:8px}
.deck{position:relative; transition:height .6s var(--spring); touch-action:pan-y}
.kc{position:absolute; left:0; right:0; top:0; background:var(--card); border-radius:24px; box-shadow:0 14px 30px -24px rgba(17,25,21,.45), 0 0 0 1px var(--line); transform-origin:50% 100%; transition:transform .6s var(--spring), height .6s var(--spring), opacity .4s; overflow:hidden; will-change:transform}
.kc.dragging{transition:none}
.kc-in{padding:16px; transition:opacity .3s}
.kc.back .kc-in{opacity:0}
.kc.back{pointer-events:none}
.kc-top{display:flex; align-items:center; gap:10px}
.av{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-weight:900; font-size:15px; color:#fff; flex:none; background:hsl(var(--h) 52% 52%)}
.kc-who{flex:1; min-width:0}
.kc-who b{font-size:14px; display:block}
.kc-who small{font-size:11.5px; color:var(--ink3)}
.kc-rank{font:800 14px var(--f-num); color:var(--ink3)}
.kc-rank.r1{color:var(--carb)}
.kc h4{font-size:15.5px; margin:12px 0 10px; line-height:1.45}
.kc-ratio .mbar{height:10px}
.kc-leg{display:flex; gap:12px; margin-top:7px; font-size:12px; color:var(--ink2)}
.kc-leg span{display:flex; align-items:center; gap:5px}
.kc-leg b{font-family:var(--f-num)}
.kc-sum{font-size:13.5px; color:var(--ink2); line-height:1.75; margin:12px 0 12px}
.kc-foot{display:flex; align-items:center; gap:10px}
.heat{display:flex; align-items:center; gap:4px; font:700 13px var(--f-num); color:#C9541F}
.heat svg{width:15px; height:15px; fill:#F07A3E; stroke:none}
.kc-stat{flex:1; font-size:11.5px; color:var(--ink3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.adopt{height:36px; padding:0 14px; border-radius:12px; background:var(--leaf-l); color:var(--leaf-d); font-weight:700; font-size:13px; display:inline-flex; align-items:center; gap:5px; flex:none}
.adopt.on{background:var(--leaf); color:#fff}
.adopt svg{width:14px; height:14px; stroke-width:3}
.deck-btn{display:flex; align-items:center; justify-content:center; gap:6px; width:100%; margin-top:12px; height:44px; border-radius:15px; background:var(--fill); border:0; font-size:14px; font-weight:500; color:var(--ink2)}
.deck-btn .chev{transition:transform .5s var(--spring)}
.deck-btn.up .chev{transform:rotate(180deg)}
.deck-hint{font-size:12px; color:var(--ink3); text-align:center; margin-top:8px}

/* ---------- meals ---------- */
.sum-card{display:flex; align-items:center; gap:16px; padding:18px}
.sum-card .mac-list{gap:12px}
.tipline{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:14px 2px 0; font-size:12.5px; color:var(--ink2)}
.switch{display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:500; color:var(--ink)}
.switch i{width:44px; height:26px; border-radius:15px; background:#D5DCD3; position:relative; transition:background .3s}
.switch i::after{content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.18); transition:transform .5s var(--spring-hard), width .25s}
.switch.on i{background:var(--leaf)}
.switch.on i::after{transform:translateX(18px)}
.switch.is-pressed i::after{width:26px}
.switch.on.is-pressed i::after{transform:translateX(12px)}
.dev{margin:10px 2px 0; font-size:12.5px; color:var(--warn-ink); background:var(--warn-bg); border-radius:12px; padding:8px 12px; line-height:1.55}
.meals{display:flex; flex-direction:column; gap:12px; margin-top:16px}
.meal{position:relative; background:var(--card); border-radius:24px; padding:6px 6px 8px; border:1px solid var(--line); box-shadow:0 10px 26px -22px rgba(17,25,21,.28); transition:background .4s, border-color .4s}
.meal.done{background:#F7FCF9; border-color:#D5EFE0}
.meal-h{display:flex; align-items:center; gap:12px; padding:10px 10px 8px}
.meal-h .mt{flex:1; min-width:0}
.meal-h h3{margin:0; font-size:17px; display:flex; align-items:center; gap:8px}
.meal-h h3 .mic{width:26px; height:26px; border-radius:9px; display:grid; place-items:center}
.meal-h h3 .mic svg{width:16px; height:16px}
.meal-h small{display:block; font-size:12px; color:var(--ink3); margin-top:3px}
.meal-h small b{font-family:var(--f-num); color:var(--ink2)}
.fi{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:16px; transition:background .3s}
.fi.flip{animation:flip .55s var(--spring)}
@keyframes flip{0%{transform:perspective(500px) rotateX(-90deg); opacity:.2} 100%{transform:none; opacity:1}}
.fi-main{flex:1; min-width:0; display:flex; align-items:center; gap:10px; text-align:left}
.fav{width:38px; height:38px; border-radius:13px; display:grid; place-items:center; font-weight:900; font-size:15px; flex:none; transition:opacity .3s}
.r-protein{background:var(--pro-l); color:#2D6CB5} .r-carb{background:var(--carb-l); color:#A86A00} .r-veg{background:var(--leaf-l); color:var(--leaf-d)} .r-fruit{background:#FDE7EF; color:#B43C6B} .r-fat,.r-oil{background:var(--fat-l); color:#B4463A} .r-other{background:var(--line2); color:var(--ink2)}
.fi-txt{min-width:0; flex:1}
.fi-txt b{display:inline; font-size:15px; font-weight:700; background:linear-gradient(currentColor,currentColor) 0 58% / 0 1.6px no-repeat; transition:background-size .4s var(--out), color .3s}
.fi-txt small{display:block; font-size:12px; color:var(--ink3); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fi-txt small b{font-family:var(--f-num); font-size:12px; color:var(--ink2); background:none}
.fi.on .fi-txt > b{background-size:100% 1.6px; color:var(--ink3)}
.fi.on .fav{opacity:.45}
.fi .swap{width:34px; height:34px; border-radius:11px; display:grid; place-items:center; color:var(--ink3); flex:none}
.fi .swap svg{width:17px; height:17px}
.fi .swap.spin svg{animation:spin .5s var(--out)}
.stamp{position:absolute; right:18px; top:20px; padding:4px 10px; border:2.5px solid var(--leaf); color:var(--leaf); border-radius:10px; font-weight:900; font-size:15px; letter-spacing:.1em; opacity:0; transform:scale(2.2) rotate(-14deg); pointer-events:none}
.meal.done .stamp{animation:stamp .55s var(--spring-hard) forwards}
.meal-h .pill-btn{transition:opacity .25s, transform .4s var(--spring)}
.meal.done .meal-h .pill-btn{opacity:0; transform:scale(.6); pointer-events:none}
@keyframes stamp{0%{opacity:0; transform:scale(2.2) rotate(-14deg)} 100%{opacity:.85; transform:scale(1) rotate(-14deg)}}
.extra-tag{font-size:10.5px; color:var(--leaf-d); background:var(--leaf-l); padding:1px 6px; border-radius:6px; margin-left:4px; vertical-align:2px}

/* ---------- food & recipe ---------- */
.fd-hero{display:flex; align-items:flex-end; justify-content:space-between; gap:12px}
.fd-hero h1{font-size:30px; font-weight:900; margin:8px 0 0}
.fd-hero .per{font-size:12.5px; color:var(--ink3); margin-top:4px}
.fd-kcal{text-align:right}
.fd-kcal b{font:800 40px var(--f-num); line-height:1}
.fd-kcal small{display:block; font-size:12px; color:var(--ink3)}
.nut-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:18px}
.nut{background:var(--fill); border-radius:20px; padding:14px}
.nut > span{font-size:12.5px; color:var(--ink2); display:flex; align-items:center; gap:6px}
.nut b{display:block; font:800 24px var(--f-num); margin:6px 0 8px}
.nut b small{font-size:13px; font-weight:500; color:var(--ink3); margin-left:2px}
.nut .bar{height:6px; border-radius:4px; background:#E4E8E6; overflow:hidden}
.nut .bar i{display:block; height:100%; width:0; border-radius:4px; transition:width .9s var(--spring)}
.energy{margin-top:12px; padding:14px 16px}
.energy .el{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink2); margin-bottom:8px}
.energy .el b{font-family:var(--f-num)}
.energy .mbar{height:12px}
.rc-list{display:flex; flex-direction:column; gap:10px; margin-top:12px}
.rc{display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--card); border-radius:20px; padding:14px; border:1px solid var(--line); box-shadow:0 10px 26px -22px rgba(17,25,21,.28)}
.rc .cz{width:46px; height:46px; border-radius:15px; display:grid; place-items:center; font-weight:900; font-size:14px; flex:none; background:var(--line2)}
.rc div{flex:1; min-width:0}
.rc b{font-size:15px; display:block}
.rc small{display:block; font-size:12px; color:var(--ink3); margin-top:3px}
.rc .rk{text-align:right; flex:none}
.rc .rk b{font:800 18px var(--f-num)}
.rc .rk small{margin-top:0}
.meta-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.ing{display:flex; flex-direction:column}
.ing-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line2); font-size:14px}
.ing-row:last-child{border-bottom:0}
.ing-row .fav{width:30px; height:30px; border-radius:10px; font-size:13px}
.ing-row .in{flex:1}
.ing-row b{font-family:var(--f-num)}
.ing-row small{color:var(--ink3); font-size:12px; width:64px; text-align:right; font-family:var(--f-num)}
.steps{display:flex; flex-direction:column; gap:8px}
.step{display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%; background:var(--fill); border-radius:16px; padding:12px 14px; font-size:14px; line-height:1.65; color:var(--ink)}
.step .ck{width:24px; height:24px; margin-top:1px}
.step .ck svg{width:15px; height:15px}
.step .st{flex:1; transition:color .3s; text-decoration:line-through transparent; text-decoration-thickness:1.5px}
.step.on .st{color:var(--ink3); text-decoration-color:var(--ink3)}
.step-prog{font:600 12px var(--f-num); color:var(--ink3)}

/* ---------- builder ---------- */
.fl{display:flex; flex-direction:column; gap:8px; margin-top:12px}
.fr{display:flex; align-items:center; gap:12px; background:var(--fill); border-radius:18px; padding:10px 10px 10px 12px}
.fr .fi-txt b{font-size:15px}
.fr .fi-txt small{white-space:normal}
.addb{width:40px; height:40px; border-radius:14px; background:var(--ink); color:#fff; display:grid; place-items:center; flex:none}
.addb svg{width:20px; height:20px; stroke-width:2.6}
.basket{position:absolute; left:16px; right:16px; bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:16; height:64px; border-radius:22px; background:var(--ink); color:#fff; display:flex; align-items:center; gap:12px; padding:0 10px 0 14px; box-shadow:0 18px 30px -14px rgba(19,36,26,.6); text-align:left}
@media (min-width:641px){ .basket{bottom:26px} }
.basket .bk-ic{position:relative; width:42px; height:42px; border-radius:14px; background:rgba(255,255,255,.1); display:grid; place-items:center}
.basket .badge{position:absolute; top:-6px; right:-6px; min-width:20px; height:20px; border-radius:10px; background:var(--leaf); font:800 12px var(--f-num); display:grid; place-items:center; padding:0 5px; box-sizing:border-box}
.basket .badge.bump{animation:bump .45s var(--spring-hard)}
.basket .bk-t{flex:1; min-width:0}
.basket .bk-t b{font:800 18px var(--f-num)}
.basket .bk-t small{display:block; font-size:12px; color:rgba(255,255,255,.6)}
.basket .bk-go{height:44px; padding:0 16px; border-radius:15px; background:var(--leaf); font-weight:700; font-size:14px; display:grid; place-items:center}
.fly{position:absolute; left:0; top:0; z-index:97; pointer-events:none}
.fly i{display:block; width:16px; height:16px; border-radius:50%; box-shadow:0 4px 10px rgba(0,0,0,.2)}
.bi{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line2); transition:opacity .3s, transform .4s var(--out)}
.bi.gone{opacity:0; transform:translateX(40px)}
.bi .fi-txt b{font-size:14.5px}
.amt-btn{height:34px; padding:0 10px; border-radius:11px; background:var(--fill); font:700 14px var(--f-num); flex:none}
.del{width:32px; height:32px; border-radius:10px; display:grid; place-items:center; color:var(--ink3); flex:none}
.del svg{width:16px; height:16px}
.tot{margin-top:14px; background:var(--fill); border-radius:18px; padding:14px}
.tot-h{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px}
.tot-h b{font:800 22px var(--f-num)}
.tot-h small{font-size:12px; color:var(--ink3)}
.name-in{display:flex; gap:8px; margin-top:10px}
.name-in input{flex:1; height:46px; border-radius:14px; border:1.5px solid var(--line); padding:0 14px; outline:0; min-width:0}
.name-in input:focus{border-color:var(--ink)}
.amount-live{text-align:center; font-size:13px; color:var(--ink2); margin:8px 0 0}
.amount-live b{font-family:var(--f-num); color:var(--ink)}

/* ---------- log ---------- */
.date-sw{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px; background:var(--fill); border-radius:18px; padding:6px}
.date-sw .dl{text-align:center; flex:1}
.date-sw .dl b{font-size:15px; display:block}
.date-sw .dl small{font-size:12px; color:var(--ink3)}
.date-sw button{width:42px; height:42px; border-radius:14px; display:grid; place-items:center; background:var(--card)}
.date-sw button:disabled{opacity:.3; pointer-events:none}
.slide-l{animation:slL .45s var(--out)} .slide-r{animation:slR .45s var(--out)}
@keyframes slL{from{opacity:0; transform:translateX(-30px)}} @keyframes slR{from{opacity:0; transform:translateX(30px)}}
.lm{display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line2)}
.lm:last-child{border-bottom:0; padding-bottom:2px}
.lm .mic{width:32px; height:32px; border-radius:11px; display:grid; place-items:center; flex:none}
.lm .mic svg{width:17px; height:17px}
.lm div{flex:1; min-width:0}
.lm b{font-size:14px}
.lm p{margin:3px 0 0; font-size:12.5px; color:var(--ink2); line-height:1.6}
.lm .lk{font:700 14px var(--f-num); flex:none}
.wt-head{display:flex; justify-content:space-between; align-items:flex-start}
.wt-head .num{font-size:34px; font-weight:800}
.wt-head small{color:var(--ink3); font-size:12.5px}
.delta{font:700 12.5px var(--f-num); padding:3px 8px; border-radius:8px; margin-left:6px; vertical-align:6px}
.delta.down{background:var(--leaf-l); color:var(--leaf-d)} .delta.up{background:var(--fat-l); color:#B4463A}
.bars{display:grid; grid-template-columns:repeat(7,1fr); gap:8px; align-items:end; height:120px; margin-top:16px}
.bcol{display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; position:relative}
.bcol i{display:block; width:100%; max-width:26px; border-radius:9px 9px 6px 6px; background:#CFE9DA; transform-origin:bottom; animation:grow .8s var(--spring) both; animation-delay:calc(var(--i) * 60ms)}
.bcol.today i{background:var(--leaf)}
.bcol.none i{background:repeating-linear-gradient(45deg, var(--line2) 0 4px, var(--line) 4px 8px)}
.bcol small{font-size:11px; color:var(--ink3)}
.bcol .bv{position:absolute; top:-4px; font:700 11px var(--f-num); color:var(--ink2); opacity:0; transform:translateY(4px); transition:opacity .2s, transform .3s var(--spring)}
.bcol.show .bv{opacity:1; transform:translateY(-14px)}
@keyframes grow{from{transform:scaleY(0)}}

   nutrition logic
   ========================================================= */
function fixRatio(r){
  const o = {c:Math.round(r.c), p:Math.round(r.p), f:Math.round(r.f)};
  ['c','p','f'].forEach(k => o[k] = clamp(o[k], 5, 80));
  let diff = 100 - (o.c + o.p + o.f);
  const order = ['c','p','f'].sort((a,b) => o[b]-o[a]);
  for(const k of order){ if(!diff) break; const nv = clamp(o[k]+diff, 5, 80); diff -= (nv - o[k]); o[k] = nv; }
  return o;
}
function adjustRatio(r, k, d){
  const nv = clamp(r[k]+d, 5, 75);
  if(nv === r[k]) return null;
  const [a, b] = ['c','p','f'].filter(x => x !== k);
  const rest = 100 - nv, sum = r[a] + r[b];
  let va = sum > 0 ? Math.round(rest * r[a] / sum) : Math.round(rest/2), vb = rest - va;
  if(va < 5){ va = 5; vb = rest - 5; } if(vb < 5){ vb = 5; va = rest - 5; }
  if(va > 80 || vb > 80) return null;
  return {[k]:nv, [a]:va, [b]:vb};
}
const sameRatio = (a,b) => a && b && a.c===b.c && a.p===b.p && a.f===b.f;
function bmiCalc(p){ const m = p.heightCm/100; return m > 0 ? p.weightKg/(m*m) : 0; }
function bmi(p){ return p.bmiManual != null ? p.bmiManual : bmiCalc(p); }
function bmiCat(b){
  if(b < 18.5) return {k:'under', n:'偏瘦', tip:'低于正常范围（18.5–23.9）'};
  if(b < 24) return {k:'normal', n:'正常', tip:'处于正常范围（18.5–23.9）'};
  if(b < 28) return {k:'over', n:'超重', tip:'高于正常范围（18.5–23.9）'};
  return {k:'obese', n:'肥胖', tip:'明显高于正常范围（18.5–23.9）'};
}
function bmr(p){
  if(p.bodyFatPct) return 370 + 21.6 * p.weightKg * (1 - p.bodyFatPct/100);
  return 10*p.weightKg + 6.25*p.heightCm - 5*p.age + (p.gender === 'female' ? -161 : 5);
}
const actOf = k => ACTS.find(a => a.k === k) || ACTS[1];
function tdee(p){ return bmr(p) * actOf(p.activity).x; }
function dayFor(plan, key){ if(!plan || !plan.cycle) return null; const k = plan.cycle.week[weekIdx(key)]; return plan.cycle.days.find(d => d.key === k) || null; }
function effRatio(plan, base, day){
  if(!day) return base;
  const d = plan.ratio;
  return fixRatio({c:day.ratio.c + base.c - d.c, p:day.ratio.p + base.p - d.p, f:day.ratio.f + base.f - d.f});
}
function targetFor(profile, plan, base, key){
  const T = tdee(profile), day = dayFor(plan, key);
  let adj = day ? day.adj : plan.adj;
  if(profile.age < 18) adj = Math.max(adj, -0.1);
  let kcal, fixed = false;
  if(day && day.fixed){ kcal = day.fixed[profile.gender] || 600; fixed = true; }
  else { kcal = Math.round(T*(1+adj)/10)*10; kcal = Math.max(kcal, profile.gender === 'female' ? 1200 : 1500); }
  const r = effRatio(plan, base, day);
  return {kcal, r, c:kcal*r.c/400, p:kcal*r.p/400, f:kcal*r.f/900, day, fixed};
}
function warnings(profile, t){
  const w = [], gk = t.p / profile.weightKg;
  if(gk < 0.8) w.push('蛋白质低于 0.8 g/kg，可能不利于保住肌肉');
  if(gk > 2.5) w.push('蛋白质超过 2.5 g/kg，有肾脏问题的话请先咨询医生');
  if(t.f / profile.weightKg < 0.5) w.push('脂肪低于 0.5 g/kg，长期这样吃可能影响激素水平');
  if(!t.fixed && t.kcal < bmr(profile)) w.push('目标热量低于基础代谢，不建议长期这样吃');
  if(t.fixed) w.push('这天是断食日，热量按固定值计算');
  return w;
}

/* =========================================================
   meal generator
   ========================================================= */
const SPLIT3 = {breakfast:.3, lunch:.4, dinner:.3}, SPLIT4 = {breakfast:.25, lunch:.35, dinner:.3, snack:.1};
const MEAL_META = {
  breakfast:{n:'早餐', time:'7:00–9:00', icon:'sun', cls:'r-carb'}, lunch:{n:'午餐', time:'11:30–13:00', icon:'bowl', cls:'r-veg'},
  dinner:{n:'晚餐', time:'18:00–19:30', icon:'moon', cls:'r-protein'}, snack:{n:'加餐', time:'下午或训练后', icon:'cup', cls:'r-fruit'}
};
function foodBlocked(f, profile){
  for(const a of profile.allergies){ const t = ALLERGY_TAG[a]; if(t && f.tags.includes(t)) return true; }
  for(const d of profile.dislikes){ const t = DISLIKE_TAG[d]; if(t && f.tags.includes(t)) return true; }
  return false;
}
function pool(role, type, plan, profile){
  return FOODS.filter(f => {
    if(f.role !== role || f.tags.includes('supp') || foodBlocked(f, profile)) return false;
    if(plan.tags.includes('plant') && (f.tags.includes('meat') || f.tags.includes('seafood'))) return false;
    if(plan.id === 'lowgi' && role === 'carb' && !f.tags.includes('lowgi')) return false;
    if(role === 'carb' || role === 'protein'){
      if(type === 'snack') return f.tags.includes('snack');
      return f.tags.includes(type === 'breakfast' ? 'bf' : 'ld');
    }
    if(role === 'fat' && type === 'snack') return f.tags.includes('snack');
    if(role === 'oil' && plan.id === 'med') return f.id === 'oliveoil';
    return true;
  });
}
function genMeal(type, tg, ctx){
  const {plan, profile, lowCarb, date} = ctx;
  const sw = S.swaps[date] || {};
  const ms = sw[type] || 0;
  const seed = role => hash(date + type + role) + ms*7 + (sw[type + ':' + role] || 0);
  const pick = (role) => { const arr = pool(role, type, plan, profile); return arr.length ? arr[seed(role) % arr.length] : null; };
  const items = [];
  const add = (role, f, amount) => { if(f && amount > 0) items.push({role, foodId:f.id, amount}); };
  const sum = k => items.reduce((s, it) => s + FOOD[it.foodId].per[k]*it.amount/100, 0);
  if(type === 'breakfast' || type === 'snack'){ if(!(lowCarb && type === 'snack')) add('fruit', pick('fruit'), lowCarb ? 50 : 100); }
  else add('veg', pick('veg'), 200);
  if(!lowCarb && type !== 'snack'){
    const cf = pick('carb');
    if(cf){ const amt = clamp(r5((tg.c - sum('c'))/(cf.per.c/100)), 0, 350); if(amt >= 20) add('carb', cf, amt); }
  }
  const pf = pick('protein');
  if(pf){ const amt = clamp(r5((tg.p - sum('p'))/(pf.per.p/100)), 0, Math.min(pf.max || 250, type === 'snack' ? 200 : 250)); if(amt >= 20) add('protein', pf, amt); }
  if(pf && tg.p - sum('p') > 12 && type !== 'snack'){
    const arr = pool('protein', type, plan, profile).filter(f => f.id !== pf.id);
    const p2 = arr.length ? arr[seed('protein2') % arr.length] : null;
    if(p2){ const amt = clamp(r5((tg.p - sum('p'))/(p2.per.p/100)), 0, Math.min(p2.max || 250, 200)); if(amt >= 20) add('protein2', p2, amt); }
  }
  if(lowCarb){
    const ff = pick('fat');
    if(ff){ const amt = clamp(r5((tg.f - sum('f'))/(ff.per.f/100)), 0, 40); if(amt >= 10) add('fat', ff, amt); }
  }
  if(type === 'lunch' || type === 'dinner' || (lowCarb && type === 'breakfast')){
    const of = pick('oil');
    if(of){ const amt = clamp(Math.round((tg.f - sum('f'))/(of.per.f/100)), 0, lowCarb ? 30 : 20); if(amt >= 2) add('oil', of, amt); }
  }
  return items;
}
function genDay(date){
  const plan = PLAN[S.plan.id];
  const t = targetFor(S.profile, plan, S.plan.ratio, date);
  const split = S.snack ? SPLIT4 : SPLIT3;
  const lowCarb = plan.tags.includes('keto') || plan.tags.includes('low_carb') || (t.day && t.day.key === 'low');
  const ctx = {plan, profile:S.profile, lowCarb, date};
  const extras = (S.extra[date] || []);
  const meals = Object.keys(split).map(type => {
    const k = split[type];
    const items = genMeal(type, {c:t.c*k, p:t.p*k, f:t.f*k}, ctx).map(it => ({...it, key:type + '|' + it.role}));
    extras.filter(x => x.meal === type).forEach(x => items.push({role:FOOD[x.foodId].role, foodId:x.foodId, amount:x.amount, key:'x|' + x.id, extra:true}));
    return {type, items, kcal:Math.round(t.kcal*k)};
  });
  if(!S.snack){
    const sx = extras.filter(x => x.meal === 'snack');
    if(sx.length) meals.push({type:'snack', kcal:0, items:sx.map(x => ({role:FOOD[x.foodId].role, foodId:x.foodId, amount:x.amount, key:'x|' + x.id, extra:true}))});
  }
  return {t, meals};
}

/* =========================================================
   inertia engine: wheel picker + ruler
   ========================================================= */
class Inertia {
  constructor(o){ this.min = o.min; this.max = o.max; this.pos = o.value; this.onFrame = o.onFrame; this.onStep = o.onStep; this.raf = 0; this.last = Math.round(o.value); this.samples = []; }
  setPos(p){ this.pos = p; this.onFrame(p); const r = clamp(Math.round(p), this.min, this.max); if(r !== this.last){ this.last = r; if(this.onStep) this.onStep(r); } }
  stop(){ cancelAnimationFrame(this.raf); this.raf = 0; }
  grab(){ this.stop(); this.base = this.pos; this.samples = [{p:this.pos, t:performance.now()}]; }
  rub(x){ return (1 - 1/(x*0.55 + 1))/0.55; }
  drag(delta){
    let p = this.base + delta;
    if(p < this.min) p = this.min - this.rub(this.min - p); else if(p > this.max) p = this.max + this.rub(p - this.max);
    this.setPos(p); this.samples.push({p, t:performance.now()}); if(this.samples.length > 8) this.samples.shift();
  }
  release(){
    const now = performance.now(), s = this.samples.filter(q => now - q.t < 110);
    let v = 0; if(s.length > 1){ const a = s[0], b = s[s.length-1]; v = (b.p - a.p)/Math.max(16, b.t - a.t); }
    if(this.pos < this.min || this.pos > this.max){ this.spring(clamp(Math.round(this.pos), this.min, this.max), 0); return; }
    const tau = 325, target = Math.round(this.pos + v*tau);
    if(target < this.min || target > this.max){ this.spring(clamp(target, this.min, this.max), v*1000); return; }
    this.decay(target, Math.abs(v) < 0.002 ? 120 : tau);
  }
  decay(target, tau){
    this.stop(); if(RM){ this.setPos(target); return; }
    const amp = target - this.pos, t0 = performance.now();
    const step = now => { const d = amp*Math.exp(-(now - t0)/tau); if(Math.abs(d) < 0.004){ this.setPos(target); this.raf = 0; return; } this.setPos(target - d); this.raf = requestAnimationFrame(step); };
    this.raf = requestAnimationFrame(step);
  }
  spring(target, v0=0){
    this.stop(); if(RM){ this.setPos(target); return; }
    let x = this.pos - target, v = v0, lt = performance.now();
    const k = 170, c = 2*Math.sqrt(k)*0.6;
    const step = now => { const dt = Math.min(0.032, (now - lt)/1000); lt = now; const a = -k*x - c*v; v += a*dt; x += v*dt;
      if(Math.abs(x) < 0.003 && Math.abs(v) < 0.02){ this.setPos(target); this.raf = 0; return; } this.setPos(target + x); this.raf = requestAnimationFrame(step); };
    this.raf = requestAnimationFrame(step);
  }
  to(t){ this.spring(clamp(t, this.min, this.max), 0); }
}

    el.innerHTML = '<div class="wheel-in"></div>'; this.inn = el.firstChild; this.slots = [];
    for(let i=0; i<11; i++){ const s = document.createElement('div'); s.className = 'wslot'; this.inn.appendChild(s); this.slots.push(s); }
    this.m = new Inertia({min:0, max:this.vals.length-1, value:clamp(o.index || 0, 0, this.vals.length-1), onFrame:p => this.paint(p), onStep:i => { this.tick(); if(this.onChange) this.onChange(this.vals[i], i); }});

class Ruler {
  constructor(el, o){

    el.innerHTML = `<div class="ruler-strip" style="width:${this.n*this.px}px; --px:${this.px}px; --major:${this.px*this.major}px">${labels}</div><div class="ruler-needle"></div>`;
    this.strip = el.firstChild;

  bind(){
    const el = this.el; let sx = 0, down = false;
    el.addEventListener('pointerdown', e => { down = true; sx = e.clientX; this.m.grab(); try{ el.setPointerCapture(e.pointerId); }catch(_){} if(this.onGrab) this.onGrab(); });
    el.addEventListener('pointermove', e => { if(!down) return; this.m.drag(-(e.clientX - sx)/this.px); });
    const up = () => { if(!down) return; down = false; this.m.release(); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    let wt = 0;
    el.addEventListener('wheel', e => { e.preventDefault(); this.m.stop(); const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY; this.m.setPos(clamp(this.m.pos + d/this.px/2, 0, this.n)); clearTimeout(wt); wt = setTimeout(() => this.m.to(Math.round(this.m.pos)), 120); }, {passive:false});

   router
   ========================================================= */
const SCREENS = {};
let stack = [], current = null;
const TABS = ['home','plans','log','me'];
function go(name, params={}, how='push'){
  if(current && current.entry){ const sc = $('.scroll', current.el); if(sc) current.entry.scroll = sc.scrollTop; }
  if(how === 'tab' || how === 'root') stack = [{name, params}];
  else if(how === 'replace') stack[stack.length-1] = {name, params};
  else stack.push({name, params});
  render(how);
}
function setStack(entries, how){ stack = entries.map(e => ({name:e.name, params:e.params || {}})); render(how); }
function back(){ if(stack.length > 1){ stack.pop(); render('pop'); } else go('home', {}, 'tab'); }
function render(how){
  const entry = stack[stack.length-1], scr = SCREENS[entry.name];
  $$('.sheet-wrap', layer).forEach(w => w.remove());
  const el = document.createElement('section'); el.className = 'screen';
  el.innerHTML = scr.render(entry.params || {});
  if(el.querySelector('.topnav')) el.classList.add('has-nav');
  if(el.querySelector('.bottom-bar, .basket')) el.classList.add('has-bar');
  view.appendChild(el);
  const old = current; current = {el, entry};
  el._acts = (scr.mount && scr.mount(el, entry.params || {})) || {};
  if(how === 'pop' && entry.scroll){ const sc = $('.scroll', el); if(sc) sc.scrollTop = entry.scroll; }
  const tabIdx = TABS.indexOf(entry.name);
  tabbar.classList.toggle('hide', tabIdx < 0 || stack.length > 1);
  if(tabIdx >= 0) setTab(tabIdx);
  const anim = RM ? '' : how;
  if(anim){ el.classList.add('enter-' + anim); el.addEventListener('animationend', function f(e){ if(e.target === el){ el.classList.remove('enter-' + anim); el.removeEventListener('animationend', f); } }); }
  if(old){
    old.el.classList.add('leave-' + (anim || 'tab'));
    old.el.style.pointerEvents = 'none';
    setTimeout(() => old.el.remove(), RM ? 0 : 520);
  }
}
function setTab(i){
  const prev = $('.tab.on', tabbar);
  $$('.tab', tabbar).forEach((t, j) => t.classList.toggle('on', j === i));
  if(prev === $$('.tab', tabbar)[i]){ /* no pop */ }
  $('#tabBlob').style.transform = `translateX(${i*100}%)`;
}
tabbar.addEventListener('click', e => {
  const t = e.target.closest('.tab'); if(!t) return;
  const name = t.dataset.tab;
  if(stack.length === 1 && stack[0].name === name){ const sc = current && $('.scroll', current.el); if(sc) sc.scrollTo({top:0, behavior:'smooth'}); return; }
  go(name, {}, 'tab');
});
view.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t || !current || !current.el.contains(t)) return;
  const act = t.dataset.act;
  const h = current.el._acts[act] || GLOBAL[act];
  if(h) h(t, e);
});
const GLOBAL = {
  back: () => back(),
  tab: t => go(t.dataset.to, {}, 'tab'),
  food: t => go('food', {id:t.dataset.id}),
  recipe: t => go('recipe', {id:t.dataset.id}),
  week: () => go('week')
};

function initNotch(el, idx, onChange){
  const rail = $('.notch-rail', el), thumb = $('.notch-thumb', el), fill = $('.notch-fill', el), dots = $$('.notch-dot', el);
  let cur = idx, drag = false;
  const place = pct => { thumb.style.left = pct + '%'; fill.style.width = pct + '%'; };
  const setIdx = (i, fire=true) => {
    i = clamp(i, 0, 4); const ch = i !== cur; cur = i;
    dots.forEach((dd, j) => dd.classList.toggle('on', j <= i)); el.setAttribute('aria-valuenow', String(i)); el.setAttribute('aria-valuetext', ACTS[i].n);
    if(ch && fire){ onChange(i); vibrate(6); thumb.classList.remove('bump'); void thumb.offsetWidth; thumb.classList.add('bump'); }
  };
  place(cur*25); setIdx(cur, false);
  const pctAt = x => { const r = rail.getBoundingClientRect(); return clamp((x - r.left)/r.width*100, 0, 100); };
  el.addEventListener('pointerdown', e => { drag = true; try{ el.setPointerCapture(e.pointerId); }catch(_){} el.classList.add('dragging'); const p = pctAt(e.clientX); place(p); setIdx(Math.round(p/25)); });
  el.addEventListener('pointermove', e => { if(!drag) return; const p = pctAt(e.clientX); place(p); setIdx(Math.round(p/25)); });
  const up = () => { if(!drag) return; drag = false; el.classList.remove('dragging'); place(cur*25); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  el.addEventListener('keydown', e => {
    if(e.key === 'ArrowRight' || e.key === 'ArrowUp'){ e.preventDefault(); setIdx(cur + 1); place(cur*25); }
    if(e.key === 'ArrowLeft' || e.key === 'ArrowDown'){ e.preventDefault(); setIdx(cur - 1); place(cur*25); }
  });
}
